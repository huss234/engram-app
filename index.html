*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --h:265;

  padding-top:env(safe-area-inset-top,0px);

  font-family:var(--font);

  /* light scheme */
  --primary:oklch(0.50 0.16 var(--h));
  --on-primary:oklch(1 0 0);
  --primary-container:oklch(0.91 0.065 var(--h));
  --on-primary-container:oklch(0.32 0.11 var(--h));
  --secondary:oklch(0.52 0.05 var(--h));
  --on-secondary:oklch(1 0 0);
  --secondary-container:oklch(0.91 0.035 var(--h));
  --on-secondary-container:oklch(0.30 0.04 var(--h));
  --tertiary:oklch(0.52 0.12 calc(var(--h) + 70));
  --tertiary-container:oklch(0.92 0.06 calc(var(--h) + 70));
  --on-tertiary-container:oklch(0.32 0.08 calc(var(--h) + 70));
  --error:oklch(0.55 0.2 27);
  --on-error:oklch(1 0 0);
  --error-container:oklch(0.92 0.05 27);
  --on-error-container:oklch(0.36 0.13 27);
  --surface:oklch(0.985 0.005 var(--h));
  --scl0:oklch(1 0 0);
  --scl1:oklch(0.97 0.008 var(--h));
  --sc:oklch(0.955 0.01 var(--h));
  --sch:oklch(0.94 0.012 var(--h));
  --schh:oklch(0.925 0.014 var(--h));
  --on-surface:oklch(0.22 0.012 var(--h));
  --on-surface-variant:oklch(0.44 0.02 var(--h));
  --outline:oklch(0.63 0.02 var(--h));
  --outline-variant:oklch(0.86 0.015 var(--h));
  --inverse-surface:oklch(0.30 0.012 var(--h));
  --inverse-on-surface:oklch(0.95 0.008 var(--h));
  --inverse-primary:oklch(0.82 0.10 var(--h));
  --scrim:rgb(0 0 0 / .32);

  --item:oklch(0.995 0.003 var(--h));

::selection{background:var(--primary-container);color:var(--on-primary-container)}

.display{font-size:calc(45px*var(--ts));line-height:1.15;font-weight:450;letter-spacing:-.01em;font-variation-settings:"wdth" 100}
.hl-l{font-size:calc(32px*var(--ts));line-height:1.25;font-weight:450;letter-spacing:-.005em}
.hl-m{font-size:calc(28px*var(--ts));line-height:1.28;font-weight:450}
.hl-s{font-size:calc(24px*var(--ts));line-height:1.33;font-weight:450}
.tt-l{font-size:calc(22px*var(--ts));line-height:1.27;font-weight:450}
.tt-m{font-size:calc(16px*var(--ts));line-height:1.5;font-weight:550;letter-spacing:.009em}
.tt-s{font-size:calc(14px*var(--ts));line-height:1.43;font-weight:550;letter-spacing:.007em}
.bd-l{font-size:calc(16px*var(--ts));line-height:1.5}
.bd-m{font-size:calc(14px*var(--ts));line-height:1.43;letter-spacing:.016em}
.bd-s{font-size:calc(12px*var(--ts));line-height:1.33;letter-spacing:.03em}
.lb-l{font-size:calc(14px*var(--ts));line-height:1.43;font-weight:550;letter-spacing:.007em}
.lb-m{font-size:calc(12px*var(--ts));line-height:1.33;font-weight:550;letter-spacing:.03em}
.muted{color:var(--on-surface-variant)}
.emph{font-weight:700}

/* ---------- icons ---------- */
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
  font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none;flex:none;
  width:1em;height:1em;overflow:hidden;
  transition:font-variation-settings var(--d-de) var(--e-de)}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:18px}
.ms.lg{font-size:32px}

/* ---------- app shell ---------- */
#app{position:relative;height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:760px){ body{background:var(--sch)} #app{box-shadow:var(--shadow-3)} }
#tabs{position:relative;flex:1;min-height:0}
.tab{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.tab.on{display:flex}
#pages{position:absolute;inset:0;pointer-events:none;z-index:20}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);pointer-events:auto}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:32px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
#overlays{position:absolute;inset:0;pointer-events:none;z-index:40}
#overlays>*{pointer-events:auto}

/* page transitions: shared axis X for push, fade-through for tabs */
.enter-x{animation:enterX var(--d-ds) var(--e-ds) both}
.exit-x{animation:exitX var(--d-fe) var(--e-fe) both}
.cover-x{animation:coverX var(--d-ds) var(--e-ds) both}
.uncover-x{animation:uncoverX var(--d-ds) var(--e-ds) both}
@keyframes enterX{from{transform:translateX(12%);opacity:0}to{transform:none;opacity:1}}
@keyframes exitX{from{transform:none;opacity:1}to{transform:translateX(10%);opacity:0}}
@keyframes coverX{from{transform:none;filter:none}to{transform:translateX(-6%);filter:brightness(.92)}}
@keyframes uncoverX{from{transform:translateX(-6%)}to{transform:none}}
.fade-through{animation:fadeThrough 260ms var(--e-de) both}
@keyframes fadeThrough{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* ---------- top app bar (large, collapses on scroll) ---------- */
.topbar{display:flex;align-items:center;gap:4px;height:64px;padding:0 4px 0 4px;flex:none;background:var(--bg);
  position:relative;z-index:2;transition:background-color var(--d-de) var(--e-de)}
.topbar.scrolled{background:var(--bar)}
.topbar .tb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;
  opacity:0;transform:translateY(6px);transition:opacity var(--d-fe) var(--e-fe),transform var(--d-fs) var(--e-fs)}
.topbar.scrolled .tb-title,.topbar.always .tb-title{opacity:1;transform:none}
.topbar .tb-title.solo{padding-left:16px}
.big-title{padding:4px 24px 20px;margin:0}
.big-sub{padding:0 24px;margin:-14px 0 20px}

/* ---------- buttons ---------- */
.rp{position:relative;overflow:hidden;isolation:isolate}
.rp::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity 150ms linear;pointer-events:none;border-radius:inherit;z-index:-1}
@media (hover:hover){.rp:hover::before{opacity:.08}}
.rp:active::before{opacity:.12}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none;z-index:-1;
  animation:ripple 450ms cubic-bezier(.2,0,0,1) forwards}
.ripple.out{animation:rippleOut 300ms linear forwards}
@keyframes ripple{to{transform:scale(1)}}
@keyframes rippleOut{from{opacity:.16;transform:scale(1)}to{opacity:0;transform:scale(1)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border:0;border-radius:20px;
  font-size:calc(14px*var(--ts));font-weight:550;letter-spacing:.007em;white-space:nowrap;background:var(--primary);color:var(--on-primary);
  transition:border-radius var(--d-xfs) var(--e-xfs),background-color var(--d-de) var(--e-de),transform var(--d-xfs) var(--e-xfs)}
.btn .ms{font-size:20px}
.btn:active{border-radius:10px}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.tertiary{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.btn.outlined{background:transparent;color:var(--on-surface-variant);box-shadow:inset 0 0 0 1px var(--outline-variant)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.text.danger{background:transparent;color:var(--error)}
.btn.m{height:56px;padding:0 24px;border-radius:28px;font-size:calc(16px*var(--ts))}
.btn.m:active{border-radius:16px}
.btn.l{height:72px;padding:0 32px;border-radius:36px;font-size:calc(18px*var(--ts));gap:12px}
.btn.l .ms{font-size:28px}
.btn.l:active{border-radius:20px}
.btn.block{display:flex;width:100%}
.btn:disabled{background:color-mix(in oklab,var(--on-surface) 10%,transparent);color:color-mix(in oklab,var(--on-surface) 38%,transparent);box-shadow:none;cursor:default}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:50%;display:inline-grid;place-items:center;color:var(--on-surface-variant);flex:none;
  transition:border-radius var(--d-xfs) var(--e-xfs)}
.ib:active{border-radius:14px}
.ib.tonal{background:var(--secondary-container);color:var(--on-secondary-container);width:40px;height:40px;margin:4px}
.ib.filled{background:var(--primary);color:var(--on-primary);width:40px;height:40px;margin:4px}
.ib.on{color:var(--primary)}
.ib.on .ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}

/* connected button group (segmented) */
.seg{display:flex;gap:2px;padding:0}
.seg>button{flex:1;height:40px;border:0;background:var(--sch);color:var(--on-surface);font-size:calc(14px*var(--ts));font-weight:550;
  display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  transition:border-radius var(--d-xfs) var(--e-xfs),background-color var(--d-de) var(--e-de),flex-grow var(--d-xfs) var(--e-xfs)}
.seg>button:first-child{border-radius:20px 8px 8px 20px}
.seg>button:last-child{border-radius:8px 20px 20px 8px}
.seg>button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-radius:20px}
.seg>button .ms{font-size:18px;width:0;opacity:0;transition:width var(--d-fs) var(--e-fs),opacity var(--d-fe) linear}
.seg>button[aria-pressed="true"] .ms{width:18px;opacity:1}
.seg>button:active{flex-grow:1.15}

/* ---------- FAB + FAB menu ---------- */
.fab{position:absolute;right:16px;bottom:16px;z-index:5;height:56px;min-width:56px;padding:0 20px 0 16px;border:0;border-radius:16px;
  background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-3);font-size:calc(16px*var(--ts));font-weight:550;
  transition:border-radius var(--d-xfs) var(--e-xfs),transform var(--d-xds) var(--e-xds),background-color var(--d-de) var(--e-de),padding var(--d-xfs) var(--e-xfs)}
.fab .lbl{transition:opacity var(--d-fe) linear,max-width var(--d-xfs) var(--e-xfs);max-width:200px;overflow:hidden;white-space:nowrap}
.fab.shrink{padding:0 16px}
.fab.shrink .lbl{max-width:0;opacity:0}
.fab:active{border-radius:22px}
.fab.open{background:var(--primary);color:var(--on-primary);border-radius:28px;padding:0 16px}
.fab.open .lbl{max-width:0;opacity:0}
.fab .ms{transition:transform var(--d-xds) var(--e-xds)}
.fab.open .ms{transform:rotate(90deg)}
.fab-menu{position:absolute;right:16px;bottom:84px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:6;pointer-events:none}
.fab-menu button{pointer-events:auto;height:56px;border:0;border-radius:28px;padding:0 24px 0 20px;display:flex;align-items:center;gap:12px;
  background:var(--primary-container);color:var(--on-primary-container);font-size:calc(16px*var(--ts));font-weight:550;box-shadow:var(--shadow);
  transform-origin:right center;animation:fabItem var(--d-xds) var(--e-xds) both}
.fab-menu button:active{border-radius:16px}
@keyframes fabItem{from{opacity:0;transform:translateY(24px) scale(.6)}to{opacity:1;transform:none}}
.fab-scrim{position:absolute;inset:0;z-index:4;background:color-mix(in oklab,var(--bg) 70%,transparent);animation:fade var(--d-de) linear both}
@keyframes fade{from{opacity:0}}

/* ---------- navigation bar ---------- */
#navbar{flex:none;display:flex;background:var(--bar);height:80px;padding:12px 0 16px;position:relative;z-index:3}
.nav-i{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;border:0;background:none;
  color:var(--on-surface-variant);font-size:calc(12px*var(--ts));font-weight:550;letter-spacing:.03em;padding:0;min-width:0}
.nav-i .ind{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;isolation:isolate}
.nav-i .ind::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--secondary-container);z-index:-1;
  transform:scaleX(.3);opacity:0;transition:transform var(--d-xfs) var(--e-xfs),opacity var(--d-fe) linear}
.nav-i[aria-current="page"]{color:var(--on-surface);font-weight:700}
.nav-i[aria-current="page"] .ind{color:var(--on-secondary-container)}
.nav-i[aria-current="page"] .ind::after{transform:none;opacity:1}
.nav-i[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.nav-i .badge{position:absolute;top:0;left:calc(50% + 4px);white-space:nowrap;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--error);color:var(--on-error);
  font-size:11px;font-weight:600;line-height:16px;text-align:center}

/* ---------- grouped lists (Android 16 settings style) ---------- */
.sec-t{margin:28px 24px 10px;color:var(--primary);font-size:calc(14px*var(--ts));font-weight:600;letter-spacing:.007em;display:flex;align-items:center;gap:8px}
.sec-t .grow{flex:1}
.sec-t .btn.text{height:32px;margin-right:-12px}
.group{display:flex;flex-direction:column;gap:2px;margin:0 16px}
.li{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 16px;background:var(--item);border-radius:4px;border:0;width:100%;text-align:left;
  color:var(--on-surface);transition:border-radius var(--d-fs) var(--e-fs)}
.li.tall{min-height:76px}
.group>.li:first-child,.group>.li.first{border-top-left-radius:20px;border-top-right-radius:20px}
.group>.li:last-child,.group>.li.last{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
.li:active{border-radius:20px}
.li .lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--primary-container);color:var(--on-primary-container)}
.li .lead.plain{background:transparent;color:var(--on-surface-variant)}
.li .lead .ms{font-size:22px}
.li .tx{flex:1;min-width:0}
.li .t1{font-size:calc(16px*var(--ts));line-height:1.45}
.li .t2{font-size:calc(14px*var(--ts));line-height:1.43;color:var(--on-surface-variant);letter-spacing:.016em}
.li .t1,.li .t2{overflow:hidden;text-overflow:ellipsis}
.li .trail{color:var(--on-surface-variant);display:flex;align-items:center;gap:8px;flex:none;font-size:calc(14px*var(--ts))}
.li .sep{width:1px;align-self:stretch;margin:4px 0;background:var(--outline-variant)}
.li.danger .t1{color:var(--error)}
.li.danger .lead{background:var(--error-container);color:var(--on-error-container)}
.li.col{flex-direction:column;align-items:stretch;gap:8px}

/* ---------- switch ---------- */
.sw{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--schh);flex:none;padding:0;
  transition:background-color var(--d-de) var(--e-de),border-color var(--d-de) var(--e-de)}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--outline);
  transition:transform var(--d-xfs) var(--e-xfs),width var(--d-xfs) var(--e-xfs),height var(--d-xfs) var(--e-xfs),margin var(--d-xfs) var(--e-xfs),background-color var(--d-de) linear}
.sw:active::after{width:28px;height:28px;margin-top:-14px;margin-left:-4px}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(18px);width:24px;height:24px;margin-top:-12px;margin-left:-2px;background:var(--on-primary)}
.sw[aria-checked="true"]:active::after{width:28px;height:28px;margin-top:-14px;margin-left:-4px}
.sw .ms{position:absolute;top:50%;left:25px;margin-top:-8px;font-size:16px;color:var(--on-primary-container);z-index:1;opacity:0;transition:opacity var(--d-fe) linear}
.sw[aria-checked="true"] .ms{opacity:1}

/* ---------- slider (expressive: tall track, bar handle) ---------- */
.slider{width:100%;display:flex;flex-direction:column;gap:4px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline}
.slider .val{font-weight:650;color:var(--primary);font-variant-numeric:tabular-nums}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;--p:50%}
input[type=range].rng::-webkit-slider-runnable-track{height:16px;border-radius:8px;
  background:linear-gradient(90deg,var(--primary) 0 calc(var(--p) - 6px),transparent calc(var(--p) - 6px) calc(var(--p) + 6px),var(--secondary-container) calc(var(--p) + 6px))}
input[type=range].rng::-moz-range-track{height:16px;border-radius:8px;background:var(--secondary-container)}
input[type=range].rng::-moz-range-progress{height:16px;border-radius:8px;background:var(--primary)}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:44px;margin-top:-14px;border-radius:2px;background:var(--primary);
  transition:width var(--d-xfs) var(--e-xfs)}
input[type=range].rng:active::-webkit-slider-thumb{width:2px}
input[type=range].rng::-moz-range-thumb{width:4px;height:44px;border:0;border-radius:2px;background:var(--primary)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{height:32px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--outline-variant);background:transparent;color:var(--on-surface-variant);
  display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:calc(14px*var(--ts));font-weight:550;white-space:nowrap;flex:none;
  transition:background-color var(--d-de) var(--e-de),padding var(--d-fs) var(--e-fs),border-radius var(--d-xfs) var(--e-xfs)}
.chip:active{border-radius:16px}
.chip .ck{font-size:18px;width:0;opacity:0;margin-left:-6px;transition:width var(--d-fs) var(--e-fs),opacity var(--d-fe) linear,margin var(--d-fs) var(--e-fs)}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);box-shadow:none;padding-left:8px}
.chip[aria-pressed="true"] .ck{width:18px;opacity:1;margin-left:0}
.chip .n{opacity:.7;font-weight:500}
.chip .dot,.dot{width:8px;height:8px;border-radius:50%;flex:none;background:oklch(0.62 0.14 var(--c,265))}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:calc(12px*var(--ts));font-weight:550;
  background:var(--sch);color:var(--on-surface-variant);white-space:nowrap}
.tag.sys{background:oklch(0.93 0.04 var(--c,265));color:oklch(0.38 0.08 var(--c,265))}
:root[data-theme="dark"] .tag.sys{background:oklch(0.34 0.05 var(--c,265));color:oklch(0.90 0.05 var(--c,265))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.sys{background:oklch(0.34 0.05 var(--c,265));color:oklch(0.90 0.05 var(--c,265))}}
.tag .ms{font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px}

/* ---------- tabs ---------- */
.tabsbar{position:relative;display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--outline-variant);flex:none;background:var(--bg);padding:0 8px}
.tabsbar::-webkit-scrollbar{display:none}
.tabsbar button{flex:none;min-width:72px;height:48px;padding:0 16px;border:0;background:none;color:var(--on-surface-variant);font-size:calc(14px*var(--ts));font-weight:550}
.tabsbar button[aria-selected="true"]{color:var(--primary)}
.tabsbar .tind{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary);
  transition:transform var(--d-xfs) var(--e-xfs),width var(--d-xfs) var(--e-xfs)}

/* ---------- search bar ---------- */
.search{display:flex;align-items:center;gap:4px;height:56px;margin:0 16px 12px;padding:0 4px 0 16px;border-radius:28px;background:var(--sch);color:var(--on-surface-variant)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:calc(16px*var(--ts));color:var(--on-surface)}
.search input::placeholder{color:var(--on-surface-variant)}

/* ---------- surfaces ---------- */
.card{background:var(--item);border-radius:24px;padding:20px}
.pad{padding:0 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px}
.tile{background:var(--item);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .num{font-size:calc(28px*var(--ts));line-height:1.2;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .cap{font-size:calc(13px*var(--ts));color:var(--on-surface-variant)}
.tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--primary-container);color:var(--on-primary-container);margin-bottom:10px}
.tile.t2 .ic{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.tile.t3 .ic{background:var(--secondary-container);color:var(--on-secondary-container)}
.tile.t4 .ic{background:var(--error-container);color:var(--on-error-container)}

/* ---------- home hero ---------- */
.hero{margin:0 16px;padding:24px 20px 20px;border-radius:32px;background:var(--item);display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.ring{position:relative;width:216px;height:216px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .inner{text-align:center;display:flex;flex-direction:column;align-items:center}
.ring .big{font-size:calc(64px*var(--ts));line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 110}
.hero .counts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cnt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:calc(13px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums}
.cnt.n{background:var(--primary-container);color:var(--on-primary-container)}
.cnt.l{background:var(--g-hard);color:var(--on-g-hard)}
.cnt.r{background:var(--g-good);color:var(--on-g-good)}
.cnt.off{opacity:.45}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.systile{flex:none;width:132px;scroll-snap-align:start;border:0;text-align:left;background:var(--item);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--on-surface);
  transition:border-radius var(--d-xfs) var(--e-xfs)}
.systile:active{border-radius:28px}
.systile .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:oklch(0.92 0.05 var(--c));color:oklch(0.40 0.10 var(--c))}
:root[data-theme="dark"] .systile .ico{background:oklch(0.35 0.06 var(--c));color:oklch(0.9 0.06 var(--c))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .systile .ico{background:oklch(0.35 0.06 var(--c));color:oklch(0.9 0.06 var(--c))}}
.systile .nm{font-size:calc(14px*var(--ts));font-weight:550;line-height:1.25;height:2.5em;overflow:hidden}
.bar{height:6px;border-radius:3px;background:var(--sch);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--primary);transition:width var(--d-ss) var(--e-ss)}
.forecast{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 4px 0}
.forecast .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.forecast .b{width:100%;max-width:36px;border-radius:10px 10px 4px 4px;background:var(--secondary-container);min-height:4px;transform-origin:bottom;animation:grow var(--d-ss) var(--e-xds) both}
.forecast .col:first-child .b{background:var(--primary)}
.forecast .lab{font-size:calc(11px*var(--ts));color:var(--on-surface-variant);font-weight:550}
.forecast .v{font-size:calc(11px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleY(0)}}

/* ---------- empty state ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 32px}
.empty .shape{width:120px;height:120px;color:var(--primary-container)}
.empty .shape svg{width:100%;height:100%}

/* ---------- deck avatar shapes ---------- */
.shp{width:48px;height:48px;flex:none;display:grid;place-items:center;position:relative;color:oklch(0.40 0.11 var(--c))}
.shp svg{position:absolute;inset:0;width:100%;height:100%}
.shp svg path{fill:oklch(0.90 0.06 var(--c))}
.shp .ms{position:relative;font-size:22px}
:root[data-theme="dark"] .shp{color:oklch(0.92 0.06 var(--c))} :root[data-theme="dark"] .shp svg path{fill:oklch(0.38 0.08 var(--c))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shp{color:oklch(0.92 0.06 var(--c))} :root:not([data-theme="light"]) .shp svg path{fill:oklch(0.38 0.08 var(--c))}}
.shp.xl{width:88px;height:88px}.shp.xl .ms{font-size:40px}

/* ---------- card rows ---------- */
.crow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--item);border-radius:4px;border:0;width:100%;text-align:left;color:var(--on-surface)}
.crow .st{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.crow .st.s0{background:var(--primary)} .crow .st.s1,.crow .st.s3{background:oklch(0.72 0.14 65)} .crow .st.s2{background:oklch(0.65 0.13 150)} .crow .st.susp{background:var(--outline)}
.crow .fr{font-size:calc(15px*var(--ts));line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.crow .due{margin-left:auto;font-size:calc(12px*var(--ts));color:var(--on-surface-variant);white-space:nowrap}
.crow .ms.flag{color:var(--error);font-size:18px}

/* ---------- sheets / dialogs / menus / snackbar ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade var(--d-de) linear both}
.scrim.out{animation:fadeOut var(--d-de) linear both}
@keyframes fadeOut{to{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sc);border-radius:28px 28px 0 0;
  box-shadow:var(--shadow-3);transform:translateY(0);animation:sheetIn var(--d-xds) var(--e-xds) both;touch-action:pan-y}
.sheet.out{animation:sheetOut 220ms cubic-bezier(.3,0,1,1) both}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.sheet .handle{flex:none;padding:16px 0 8px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet .handle i{width:32px;height:4px;border-radius:2px;background:var(--outline)}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:0 16px 8px 24px;flex:none;touch-action:none}
.sheet .sh-body{overflow-y:auto;padding:4px 24px 24px;flex:1;min-height:0;overscroll-behavior:contain}
.sheet .sh-foot{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:12px 16px 16px;border-top:1px solid var(--outline-variant)}
.dialog-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.dialog{width:min(100%,400px);max-height:90%;overflow:auto;background:var(--sch);border-radius:28px;padding:24px;box-shadow:var(--shadow-3);
  animation:dlgIn var(--d-xds) var(--e-xds) both;transform-origin:center}
.dialog.out{animation:dlgOut 150ms linear both}
@keyframes dlgIn{from{opacity:0;transform:scale(.85)}}
@keyframes dlgOut{to{opacity:0;transform:scale(.95)}}
.dialog .d-ic{display:flex;justify-content:center;color:var(--secondary);margin-bottom:16px}
.dialog h2{margin:0 0 16px}
.dialog .d-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.menu{position:absolute;min-width:200px;max-width:280px;background:var(--sch);border-radius:16px;padding:4px;box-shadow:var(--shadow-3);
  animation:menuIn var(--d-xfs) var(--e-xfs) both;transform-origin:top right}
.menu.out{animation:fadeOut 120ms linear both}
@keyframes menuIn{from{opacity:0;transform:scale(.8)}}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;border:0;background:none;border-radius:12px;text-align:left;font-size:calc(14px*var(--ts));font-weight:500;color:var(--on-surface)}
.menu button .ms{font-size:20px;color:var(--on-surface-variant)}
.menu button.danger,.menu button.danger .ms{color:var(--error)}
.menu hr{border:0;height:1px;background:var(--outline-variant);margin:4px 8px}
#snack{position:absolute;left:12px;right:12px;bottom:92px;z-index:60;pointer-events:none;display:flex;justify-content:center}
.snack{pointer-events:auto;display:flex;align-items:center;gap:8px;min-height:48px;width:100%;max-width:560px;padding:6px 8px 6px 16px;border-radius:12px;
  background:var(--inverse-surface);color:var(--inverse-on-surface);box-shadow:var(--shadow-3);font-size:calc(14px*var(--ts));
  animation:snackIn var(--d-xds) var(--e-xds) both}
.snack.out{animation:snackOut 180ms linear both}
.snack .btn.text{color:var(--inverse-primary);height:36px}
@keyframes snackIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes snackOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- form fields ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:calc(12px*var(--ts));font-weight:600;color:var(--on-surface-variant);letter-spacing:.03em;padding-left:4px}
.field textarea,.field input,.field select{width:100%;border:0;border-radius:16px;background:var(--item);padding:14px 16px;font-size:calc(16px*var(--ts));
  outline:0;box-shadow:inset 0 0 0 1px var(--outline-variant);transition:box-shadow var(--d-de) var(--e-de);resize:vertical;color:var(--on-surface)}
.field textarea:focus,.field input:focus,.field select:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.field .help{font-size:calc(12px*var(--ts));color:var(--on-surface-variant);padding-left:4px}
textarea.code{font-family:ui-monospace,"Roboto Mono",monospace;font-size:13px;min-height:160px}

/* ---------- study session ---------- */
.study{background:var(--bg)}
.st-top{display:flex;align-items:center;gap:4px;height:64px;padding:0 4px;flex:none}
.st-prog{flex:1;height:24px;display:flex;align-items:center}
.st-prog svg{width:100%;height:24px;overflow:visible}
.st-counts{display:flex;justify-content:center;gap:6px;padding:0 16px 4px;flex:none}
.st-stage{flex:1;min-height:0;position:relative;margin:8px 16px 0}
.st-card{position:absolute;inset:0;background:var(--item);border-radius:32px;padding:28px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
  scrollbar-width:none;touch-action:pan-y}
.st-card::-webkit-scrollbar{display:none}
.st-card.in{animation:cardIn var(--d-xds) var(--e-xds) both}
.st-card.out-l{animation:cardOutL 180ms cubic-bezier(.3,0,1,1) both}
.st-card.out-r{animation:cardOutR 180ms cubic-bezier(.3,0,1,1) both}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) scale(.98)}}
@keyframes cardOutL{to{opacity:0;transform:translateX(-48px) rotate(-1.5deg)}}
@keyframes cardOutR{to{opacity:0;transform:translateX(48px) rotate(1.5deg)}}
.st-card .kind{display:flex;align-items:center;gap:8px;color:var(--on-surface-variant)}
.q{font-size:calc(22px*var(--ts));line-height:1.4;font-weight:450;overflow-wrap:anywhere}
.a{font-size:calc(19px*var(--ts));line-height:1.45;overflow-wrap:anywhere}
.divider{height:1px;background:var(--outline-variant);transform-origin:left;animation:divIn var(--d-ds) var(--e-ds) both}
@keyframes divIn{from{transform:scaleX(0)}}
.ans{display:flex;flex-direction:column;gap:16px;animation:ansIn var(--d-xds) var(--e-xds) both}
@keyframes ansIn{from{opacity:0;transform:translateY(20px)}}
.why{border-radius:20px;padding:14px 16px;background:var(--tertiary-container);color:var(--on-tertiary-container);font-size:calc(15px*var(--ts));line-height:1.5}
.why .wt{display:flex;align-items:center;gap:6px;font-weight:650;font-size:calc(13px*var(--ts));margin-bottom:4px}
.cloze{display:inline-block;padding:0 8px;border-radius:8px;background:var(--primary-container);color:var(--on-primary-container);font-weight:600}
.cloze.on{background:var(--primary);color:var(--on-primary);animation:pop var(--d-xfs) var(--e-xfs) both}
@keyframes pop{from{transform:scale(.8)}}
.rt b{font-weight:700}
.rt mark{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:4px;padding:0 3px}
.rt ul{margin:4px 0;padding-left:1.2em}
.rt li{margin:2px 0}
.st-bottom{flex:none;padding:12px 16px 16px}
.grades{display:flex;gap:4px}
.grades button{flex:1;height:76px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;
  font-size:calc(15px*var(--ts));font-weight:600;
  transition:flex-grow var(--d-xfs) var(--e-xfs),border-radius var(--d-xfs) var(--e-xfs)}
.grades button:first-child{border-radius:28px 10px 10px 28px}
.grades button:last-child{border-radius:10px 28px 28px 10px}
.grades button:active{flex-grow:1.3;border-radius:28px}
.grades .iv{font-size:calc(12px*var(--ts));font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.g1{background:var(--g-again);color:var(--on-g-again)} .g2{background:var(--g-hard);color:var(--on-g-hard)}
.g3{background:var(--g-good);color:var(--on-g-good)} .g4{background:var(--g-easy);color:var(--on-g-easy)}
.grades.enter button{animation:gIn var(--d-xds) var(--e-xds) both}
.grades.enter button:nth-child(2){animation-delay:30ms}.grades.enter button:nth-child(3){animation-delay:60ms}.grades.enter button:nth-child(4){animation-delay:90ms}
@keyframes gIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:inline;opacity:.55;font-size:11px;margin-left:4px}}

/* summary */
.sum-shape{width:168px;height:168px;position:relative;display:grid;place-items:center;color:var(--on-primary-container);animation:shapeIn var(--d-ss) var(--e-xds) both}
.sum-shape svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 24s linear infinite}
.sum-shape svg path{fill:var(--primary-container)}
.sum-shape .ms{font-size:64px;position:relative}
@keyframes shapeIn{from{transform:scale(.3) rotate(-60deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding:4px 0}
.heat i{width:13px;height:13px;border-radius:4px;background:var(--sch)}
.heat i.l1{background:color-mix(in oklab,var(--primary) 30%,var(--sch))}
.heat i.l2{background:color-mix(in oklab,var(--primary) 55%,var(--sch))}
.heat i.l3{background:color-mix(in oklab,var(--primary) 78%,var(--sch))}
.heat i.l4{background:var(--primary)}
.heat i.today{box-shadow:0 0 0 2px var(--tertiary)}
.stack{display:flex;height:28px;border-radius:14px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:4px;transition:flex-grow var(--d-ss) var(--e-ss)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--ts));color:var(--on-surface-variant)}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}

/* matrix map */
.matrix{overflow:auto;margin:0 16px;border-radius:20px;background:var(--item);padding:12px}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:calc(12px*var(--ts))}
.matrix th{font-weight:550;color:var(--on-surface-variant);white-space:nowrap;text-align:left;padding:0 6px 0 0}
.matrix thead th{writing-mode:vertical-rl;transform:rotate(180deg);height:96px;text-align:left;padding:4px 0}
.matrix td{width:28px;height:28px;border-radius:8px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sc);color:var(--on-surface-variant);cursor:pointer}
.matrix td.z{cursor:default;color:transparent}

/* color picker swatches (wallpaper & style) */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:56px;height:56px;border:0;padding:0;border-radius:50%;overflow:hidden;position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  background:var(--sc);transition:border-radius var(--d-xds) var(--e-xds),transform var(--d-xfs) var(--e-xfs)}
.swatch i:nth-child(1){grid-column:1/3;background:oklch(0.72 0.13 var(--sh))}
.swatch i:nth-child(2){background:oklch(0.86 0.05 var(--sh))}
.swatch i:nth-child(3){background:oklch(0.78 0.09 calc(var(--sh) + 70))}
.swatch .ms{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);width:28px;height:28px;border-radius:50%;background:oklch(0.35 0.1 var(--sh));color:#fff;
  display:grid;place-items:center;font-size:18px;transition:transform var(--d-xfs) var(--e-xfs)}
.swatch[aria-pressed="true"]{border-radius:18px}
.swatch[aria-pressed="true"] .ms{transform:translate(-50%,-50%) scale(1)}

/* loader (morphing shape) */
.loader{width:48px;height:48px;color:var(--primary)}
.loader svg{width:100%;height:100%}
.loader path{fill:currentColor}

/* import */
.dropzone{margin:0 16px;border-radius:28px;border:2px dashed var(--outline-variant);background:var(--item);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  transition:border-color var(--d-de) var(--e-de),background-color var(--d-de) var(--e-de),border-radius var(--d-xds) var(--e-xds)}
.dropzone.over{border-color:var(--primary);background:var(--primary-container);border-radius:40px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--outline-variant);font-size:calc(14px*var(--ts))}
.issue:first-child{border-top:0}
.issue .ms{font-size:20px}
.issue.warn .ms{color:oklch(0.65 0.14 65)} .issue.err .ms{color:var(--error)} .issue.ok .ms{color:oklch(0.6 0.13 150)}
.promptbox{white-space:pre-wrap;font-size:calc(13px*var(--ts));line-height:1.55;background:var(--item);border-radius:16px;padding:16px;max-height:46vh;overflow:auto;user-select:text}
.syncpill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--sch);color:var(--on-surface-variant);font-size:12px;font-weight:600}
.syncpill .ms{font-size:16px}
.syncbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border:0;border-radius:16px;background:var(--sch);color:var(--on-surface-variant);font:600 12px/1 var(--font);white-space:nowrap;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.syncbtn .ms{font-size:18px}.syncbtn:active{border-radius:10px}
.syncbtn.st-saved{background:var(--primary-container);color:var(--on-primary-container)}
.syncbtn.st-waiting,.syncbtn.st-syncing{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.syncbtn.st-error,.syncbtn.st-auth,.syncbtn.st-choice{background:var(--error-container);color:var(--on-error-container)}
.syncbtn.st-rate{background:var(--secondary-container);color:var(--on-secondary-container)}
.ms.spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.ms.spin{animation:none}}
.qrbox{display:flex;justify-content:center;background:#fff;border-radius:16px;padding:12px}.qrbox svg{max-width:100%;height:auto}
.qrcam{width:100%;border-radius:16px;background:#000;aspect-ratio:1;object-fit:cover}
.synclog>div{display:flex;flex-direction:column;gap:2px;padding:8px 2px;border-bottom:1px solid var(--outline-variant);font-size:13px}.synclog .muted{font-size:11px}
.li.warnrow .t2{color:var(--error)}.infotable .ok{color:var(--primary);font-weight:700}

.spacer{height:16px}
.hidden{display:none!important}
.center{text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
/* ---------- Engram 2 additions ---------- */
.decktree .li.deckrow{gap:10px;padding:10px 4px 10px calc(8px + var(--depth,0) * 22px);min-height:64px;cursor:pointer}
.deckrow .tog{width:36px;height:36px;color:var(--on-surface-variant)}
.deckrow .tog .ms{transition:transform var(--d-xfs) var(--e-xfs)}
.deckrow .tog.open .ms{transform:rotate(90deg)}
.deckrow .tog-sp{width:36px;flex:none}
.deckrow .shp{width:40px;height:40px}.deckrow .shp .ms{font-size:20px}
.deckrow .t1{white-space:nowrap}
:root{--c-new:oklch(0.55 0.17 255);--c-lrn:oklch(0.58 0.2 27);--c-rev:oklch(0.55 0.15 150)}
:root[data-theme="dark"]{--c-new:oklch(0.78 0.12 255);--c-lrn:oklch(0.75 0.14 27);--c-rev:oklch(0.78 0.13 150)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-new:oklch(0.78 0.12 255);--c-lrn:oklch(0.75 0.14 27);--c-rev:oklch(0.78 0.13 150)}}
.dcounts{display:inline-flex;gap:8px;font-variant-numeric:tabular-nums;font-size:calc(14px*var(--ts));font-weight:650;flex:none}
.dcounts b{min-width:14px;text-align:right}
.dcounts .cn{color:var(--c-new)}.dcounts .cl{color:var(--c-lrn)}.dcounts .cr{color:var(--c-rev)}
.dcounts .z{opacity:.28}
.dlegend .dcounts{font-size:11px;font-weight:600}
.deckhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 24px 20px}
.ovcounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.ov{background:var(--item);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center}
.ov .num{font-size:calc(30px*var(--ts));font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.ov .cap{font-size:calc(13px*var(--ts));color:var(--on-surface-variant)}
.ov.n .num{color:var(--c-new)}.ov.l .num{color:var(--c-lrn)}.ov.r .num{color:var(--c-rev)}
.deckdesc{overflow-wrap:anywhere;font-size:calc(15px*var(--ts))}
.deckdesc img{max-width:100%}
.st-card.frame{padding:0;overflow:hidden;display:block;background:var(--item)}
.cardframe{display:block;width:100%;height:100%;border:0;background:transparent}
.st-card[data-flag]{box-shadow:inset 0 0 0 3px var(--flagc)}
.st-card[data-flag="1"]{--flagc:#e53935}.st-card[data-flag="2"]{--flagc:#fb8c00}.st-card[data-flag="3"]{--flagc:#43a047}.st-card[data-flag="4"]{--flagc:#1e88e5}
.st-card[data-flag="5"]{--flagc:#d81b60}.st-card[data-flag="6"]{--flagc:#00acc1}.st-card[data-flag="7"]{--flagc:#8e24aa}
.st-card.marked::after{content:"star";font-family:"Material Symbols Rounded";position:absolute;top:10px;right:14px;font-size:22px;color:var(--tertiary);font-variation-settings:"FILL" 1;pointer-events:none}
.st-timer{font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.st-timer.over{color:var(--error)}
.cnt.cur{box-shadow:inset 0 -3px 0 currentColor}
.st-card .empty{height:100%;justify-content:center}
.edtools{position:sticky;top:0;z-index:2;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;margin:8px 0;background:var(--bg)}
.edtools::-webkit-scrollbar{display:none}
.edtools .ib{width:40px;height:40px;flex:none;background:var(--item);border-radius:12px}
.edtools .ib.clz{font-weight:700;font-size:14px;color:var(--primary);width:48px}
.fedit{min-height:52px;border-radius:16px;background:var(--item);padding:12px 16px;box-shadow:inset 0 0 0 1px var(--outline-variant);outline:0;font-size:calc(17px*var(--ts));line-height:1.45;overflow-wrap:anywhere;transition:box-shadow var(--d-de) var(--e-de)}
.fedit:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.fedit:empty::before{content:attr(data-ph);color:var(--on-surface-variant);opacity:.7}
.fedit img{max-width:100%;height:auto;border-radius:8px}
.ib.pin{width:32px;height:32px;color:var(--on-surface-variant);opacity:.6}
.ib.pin .ms{font-size:18px}
.ib.pin.on{color:var(--primary);opacity:1}
.ib.pin.on .ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.edf .dupe{color:var(--error)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:16px;background:var(--item);padding:8px 10px;box-shadow:inset 0 0 0 1px var(--outline-variant)}
.tagbox input{flex:1;min-width:100px;border:0;background:transparent;outline:0;padding:6px;font-size:calc(15px*var(--ts));color:var(--on-surface);box-shadow:none}
.tagchip{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 10px;border-radius:8px;background:var(--secondary-container);color:var(--on-secondary-container);font-size:calc(13px*var(--ts));font-weight:550}
.tagchip button{border:0;background:none;color:inherit;display:grid;place-items:center;width:24px;height:24px;border-radius:12px;padding:0}
.infotable{display:flex;flex-direction:column}
.infotable>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--outline-variant);font-size:calc(14px*var(--ts))}
.infotable>div:last-child{border-bottom:0}
.infotable>div>span:last-child{text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.revtable,.rettable{display:flex;flex-direction:column;font-size:calc(13px*var(--ts));font-variant-numeric:tabular-nums}
.revtable>div,.rettable>div{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--outline-variant)}
.rettable>div{grid-template-columns:1.3fr 1fr 1fr 1fr 1fr}
.revtable>div:last-child,.rettable>div:last-child{border-bottom:0}
.revtable .rh,.rettable .rh{font-weight:650;color:var(--on-surface-variant)}
.rettable>div>span:not(:first-child){text-align:right}
.rt1{color:var(--error);font-weight:600}.rt2{color:oklch(0.62 0.13 65);font-weight:600}.rt3{color:oklch(0.58 0.13 150);font-weight:600}.rt4{color:oklch(0.58 0.12 240);font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--on-surface-variant);margin-top:6px}
.chart-max{position:absolute;top:-2px;right:0}
.radios{display:flex;flex-direction:column;gap:2px}
.radio{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 8px;border-radius:12px;cursor:pointer;font-size:calc(15px*var(--ts))}
.radio input{width:20px;height:20px;accent-color:var(--primary);flex:none;margin:0}
.numin{width:84px;flex:none;border:0;border-radius:12px;background:var(--sch);padding:10px 12px;font-size:calc(15px*var(--ts));text-align:right;color:var(--on-surface);outline:0;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow var(--d-de) var(--e-de);font-variant-numeric:tabular-nums}
.numin:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.numin.wide{width:140px;text-align:left}
.numin.bad{box-shadow:inset 0 0 0 2px var(--error)}
.optrow{min-height:60px;gap:12px}
.optsel{width:100%;border:0;border-radius:12px;background:var(--sch);padding:10px 12px;font-size:calc(15px*var(--ts));color:var(--on-surface);outline:0}
.help code,.bd-m code,.bd-s code{font-family:ui-monospace,"Roboto Mono",monospace;font-size:.92em;background:var(--sch);padding:1px 5px;border-radius:5px}
.tpwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.tpcode{flex:1 1 40%;min-height:120px;width:100%;border:0;margin:0;padding:14px 16px;resize:none;outline:0;background:var(--item);color:var(--on-surface);font-family:ui-monospace,"Roboto Mono",monospace;font-size:13px;line-height:1.5;white-space:pre;overflow:auto;tab-size:4}
.tpbar{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 16px;flex:none;border-top:1px solid var(--outline-variant)}
.tppreview{flex:1 1 45%;min-height:140px;margin:0 12px 12px;border-radius:20px;overflow:hidden;background:#fff}
.pvframe{height:min(60vh,480px);border-radius:20px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--outline-variant)}
:root[data-theme="dark"] .tppreview,:root[data-theme="dark"] .pvframe{background:#1c1b1f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tppreview,:root:not([data-theme="light"]) .pvframe{background:#1c1b1f}}
.selbar{background:var(--secondary-container);color:var(--on-secondary-container)}
.selbar .ib{color:inherit}
.crow{cursor:pointer}
.crow.sel{background:var(--secondary-container)}
.group>.crow:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
.group>.crow:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
.crow .meta .tag{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.howto{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
.li.picked{background:var(--secondary-container)}
.li.picked .t2{color:var(--on-secondary-container)}
.optrow textarea.code{width:100%;border:0;border-radius:12px;background:var(--sch);color:var(--on-surface);padding:10px 12px;outline:0;resize:vertical}
.optrow textarea.code.bad{box-shadow:inset 0 0 0 2px var(--error)}
.field textarea.bad{box-shadow:inset 0 0 0 2px var(--error)}
.tab .scroll,.page .scroll{padding-bottom:104px}
.page.study .scroll{padding-bottom:32px}


/* ============================================================
   Top bar: sync split button + overflow menu
   ============================================================ */
.home-head{gap:4px}
.home-head .grow{margin-right:8px}
.home-head .grow>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tap syncs. The tap also reveals a second segment (details) that
   folds away again a few seconds after the sync settles. When sync
   needs attention, the segment stays out and carries the warning. */
.sync-split{display:inline-flex;align-items:center;gap:2px;flex:none;min-width:0;max-width:60vw}
.sync-split .syncbtn{position:relative;height:40px;max-width:none;min-width:0;padding:0 14px 0 12px;gap:8px;border-radius:20px;font:600 13px/1 var(--font);
  transition:border-radius var(--d-xfs) var(--e-xfs),background-color var(--d-de) var(--e-de),color var(--d-de) var(--e-de)}
.sync-split .syncbtn .ms{font-size:20px}
.sync-split .syncbtn .sl{overflow:hidden;text-overflow:ellipsis;line-height:20px}
.sync-split .syncbtn.morph .sl{flex-shrink:0;text-overflow:clip}
.sync-split .syncbtn .sl-old{position:absolute;pointer-events:none}
.sync-split .syncbtn:active{border-radius:12px}
.sync-split.open .syncbtn{border-radius:20px 6px 6px 20px}
.sync-split.open .syncbtn:active{border-radius:12px 6px 6px 12px}
.sync-more{width:0;height:40px;margin-left:-2px;padding:0;border:0;border-radius:6px 20px 20px 6px;display:grid;place-items:center;overflow:hidden;opacity:0;pointer-events:none;
  background:var(--sch);color:var(--on-surface-variant);flex:none;
  transition:width var(--d-xfs) var(--e-xfs),margin var(--d-xfs) var(--e-xfs),opacity var(--d-fe) linear,border-radius var(--d-xfs) var(--e-xfs),background-color var(--d-de) var(--e-de),color var(--d-de) var(--e-de)}
.sync-split.open .sync-more{width:40px;margin-left:0;opacity:1;pointer-events:auto}
.sync-more .ms{font-size:20px;transform:scale(.2) rotate(-150deg);transition:transform var(--d-xds) var(--e-xds)}
.sync-split.open .sync-more .ms{transform:none}
.sync-more:active{border-radius:20px}
.sync-split.st-saved>button{background:var(--primary-container);color:var(--on-primary-container)}
.sync-split.st-waiting>button,.sync-split.st-syncing>button{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.sync-split.st-error>button,.sync-split.st-auth>button,.sync-split.st-choice>button{background:var(--error-container);color:var(--on-error-container)}
.sync-split.st-rate>button{background:var(--secondary-container);color:var(--on-secondary-container)}
.sync-split.attn .sync-more .ms{font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24}

/* overflow menu: unfolds from the button that opened it */
.menu{min-width:224px;border-radius:20px;padding:6px;animation:menuIn var(--d-ds) var(--e-ds) backwards;transform-origin:top right}
.menu.up{animation-name:menuInUp;transform-origin:bottom right}
@keyframes menuIn{from{clip-path:inset(0 0 100% 35% round 20px);transform:translateY(-6px)}to{clip-path:inset(-24px -24px -40px -24px round 44px);transform:none}}
@keyframes menuInUp{from{clip-path:inset(100% 0 0 35% round 20px);transform:translateY(6px)}to{clip-path:inset(-24px -24px -40px -24px round 44px);transform:none}}
.menu>*{animation:menuItem var(--d-ds) var(--e-ds) backwards;animation-delay:calc(var(--i,0) * 22ms + 40ms)}
@keyframes menuItem{from{opacity:0;transform:translateY(-6px)}}
.menu.up>*{animation-name:menuItemUp}
@keyframes menuItemUp{from{opacity:0;transform:translateY(6px)}}
.menu.out{animation:menuOut 150ms cubic-bezier(.3,0,1,1) both}
@keyframes menuOut{to{opacity:0;transform:scale(.96)}}
.menu button{border-radius:14px;transition:border-radius var(--d-fs) var(--e-fs)}
.menu button:active{border-radius:20px}
.menu button.tog{padding-right:6px}
.menu button.tog>.ms:first-child{transition:transform var(--d-xds) var(--e-xds)}
.menu button.tog[aria-checked="true"]>.ms:first-child{transform:rotate(-25deg)}
.menu button .lbl{flex:1;min-width:0}
.menu .sw{display:inline-block;flex:none;transform:scale(.82);transform-origin:right center;pointer-events:none}

/* theme change: the whole screen cross-fades to the new colors; the control you
   touched stays live on top, so its own animation (switch thumb, press) keeps playing */
::view-transition-old(root),::view-transition-new(root){animation-duration:var(--d-ss);animation-timing-function:var(--e-de)}
::view-transition-group(theme-origin),::view-transition-new(theme-origin){animation:none}
::view-transition-old(theme-origin){display:none}

/* ============================================================
   Settings: a short list of categories, one page each
   ============================================================ */
.li .lead.cat{background:oklch(0.92 0.05 var(--c));color:oklch(0.40 0.11 var(--c))}
:root[data-theme="dark"] .li .lead.cat{background:oklch(0.36 0.07 var(--c));color:oklch(0.91 0.06 var(--c))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .li .lead.cat{background:oklch(0.36 0.07 var(--c));color:oklch(0.91 0.06 var(--c))}}
.li .lead.cat .ms{font-size:22px}
.set-cats .li{min-height:76px}
.set-cats .li .t1{font-weight:500}
.set-cats .li .t2{display:-webkit-box!important;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.set-dot{width:10px;height:10px;border-radius:50%;background:var(--error);flex:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--error) 22%,transparent)}
.set-search{margin:0 16px 20px;transition:box-shadow var(--d-de) var(--e-de),background-color var(--d-de) var(--e-de)}
.set-search:focus-within{background:var(--schh);box-shadow:inset 0 0 0 2px var(--primary)}
.set-search .ib{width:40px;height:40px}
.set-gap{height:16px}
.stagger>*{animation:setIn var(--d-ds) var(--e-ds) backwards;animation-delay:calc(var(--i,0) * 45ms + 60ms)}
@keyframes setIn{from{opacity:0;transform:translateY(18px)}}
.set-results{animation:fade var(--d-de) linear both}
.set-results .li mark{background:none;color:var(--primary);font-weight:700}
.set-results .lead.cat{width:36px;height:36px}.set-results .lead.cat .ms{font-size:20px}

.set-hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:0 24px 8px}
.set-hero h1{margin:0}
.set-hero p{margin:-6px 0 0;max-width:60ch}
.set-hero .shp.intro svg{animation:shapeIn var(--d-ss) var(--e-xds) both}
.set-hero .shp.intro .ms{animation:pop var(--d-xds) var(--e-xds) 120ms both}

/* every row on a settings page gets a quiet icon, so the column lines up */
.li .lead.plain .ms{font-size:24px}
.li.danger .lead.plain{background:transparent;color:var(--error)}
.li.warnrow .lead.plain{color:var(--error)}
.swrow{cursor:pointer}
label.li{cursor:text}
.set-h{display:flex;align-items:center;gap:16px;min-height:40px}
.set-h .t1{flex:1;min-width:0}
.set-h .val{font-weight:650;color:var(--primary);font-variant-numeric:tabular-nums;font-size:calc(14px*var(--ts))}
.li.col.set-ctl{gap:12px;padding-bottom:16px}
.li.col.set-ctl .seg,.li.col.set-ctl .swatches,.li.col.set-ctl .rng{margin-left:56px;width:calc(100% - 56px)}
.li.col.set-ctl .swatches{gap:8px}
.li.col.set-ctl .swatch{width:44px;height:44px}
.li.col.set-ctl .swatch[aria-pressed="true"]{border-radius:14px}
@media (max-width:380px){.li.col.set-ctl .seg,.li.col.set-ctl .swatches,.li.col.set-ctl .rng{margin-left:0;width:100%}}
.li.flash{animation:setFlash 1900ms var(--e-de) both}
@keyframes setFlash{0%,30%{background:var(--primary-container);color:var(--on-primary-container)}100%{}}
.set-about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 24px 12px}

/* ---------- brand: the Engram wordmark and app icon ----------
   Both are drawn as SVG strokes, not type, so they never wait on a font.
   The e trails off into two dots with widening gaps: a memory trace,
   and the growing intervals of spaced repetition. Colors follow the
   theme hue, like the rest of the app. */
:root{--wm-ink:var(--primary);--wm-spark:oklch(0.64 0.19 calc(var(--h) + 70));
  --mk-bg:var(--primary);--mk-ink:var(--on-primary);--mk-spark:oklch(0.86 0.11 calc(var(--h) + 70))}
:root[data-theme="dark"]{--wm-spark:oklch(0.80 0.13 calc(var(--h) + 70));--mk-spark:oklch(0.52 0.17 calc(var(--h) + 70))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wm-spark:oklch(0.80 0.13 calc(var(--h) + 70));--mk-spark:oklch(0.52 0.17 calc(var(--h) + 70))}}
.wordmark{display:block;flex:none;height:auto;overflow:visible;color:var(--wm-ink)}
.wordmark .wm-ink{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.wordmark .wm-dot{fill:currentColor}
.wordmark .wm-spark{fill:var(--wm-spark)}
.wordmark.intro .wm-ink path{stroke-dasharray:1 3;animation:wmDraw 620ms cubic-bezier(.35,0,.1,1) both;animation-delay:calc(var(--i) * 85ms + 150ms)}
.wordmark.intro .wm-dot,.wordmark.intro .wm-spark{transform-box:fill-box;transform-origin:center;animation:wmPop var(--d-xds) var(--e-xds) both;animation-delay:640ms}
.wordmark.intro .wm-spark{animation-delay:780ms}
@keyframes wmDraw{from{stroke-dashoffset:1.05;opacity:0}8%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes wmPop{from{transform:scale(0)}}
.appmark{display:block;flex:none;overflow:visible}
.appmark .mk-bg{fill:var(--mk-bg)}
.appmark .mk-ink{fill:none;stroke:var(--mk-ink);stroke-linecap:round}
.appmark .mk-dot{fill:var(--mk-ink)}
.appmark .mk-spark{fill:var(--mk-spark)}
@media (prefers-reduced-motion: reduce){.wordmark.intro *,.about-hero.intro *{animation:none!important}}

/* home: the wordmark sits in the top-left, on the same line as the actions */
.home-brand{padding:12px 8px 12px 24px;min-height:60px}
.home-brand .wordmark{width:125px;max-width:calc(100% - 150px);margin:3px auto 0 -1px}

/* settings: the About row and page */
.li .lead.mk-lead{background:transparent}
.about-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 24px 28px}
.about-hero .appmark{width:112px;height:112px;margin-bottom:22px}
.about-hero h1{margin:0;line-height:0}
.about-hero .wordmark{width:186px;max-width:100%}
.about-hero>*{max-width:100%}
.about-hero p{margin:18px 0 0;max-width:34ch}
.about-hero .about-ver{margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--secondary-container);color:var(--on-secondary-container)}
.about-hero.intro .appmark .mk-bg{transform-box:fill-box;transform-origin:center;animation:shapeIn var(--d-ss) var(--e-xds) both}
.about-hero.intro .appmark g{animation:fade var(--d-ds) linear 180ms both}
.about-hero.intro p,.about-hero.intro .about-ver{animation:setIn var(--d-ds) var(--e-ds) 420ms backwards}

/* ============================================================
   Screen sizes
   Portrait (phone, tablet, desktop window): the phone layout, edge to edge.
   Landscape tablet / desktop: navigation rail on the left, list and detail
   side by side, multi-column home and stats, split study screen.
   Short landscape (a phone on its side) keeps the centered phone column.
   Layouts inside tabs and pages answer to their own width (container
   queries), so a list squeezed next to a detail pane falls back to one column.
   ============================================================ */
:root{--rail-w:96px;--list-w:clamp(340px,38%,460px)}
.tab,.page{container-type:inline-size}
.nav-i.rail-only{display:none}
.li.deckrow.pane-on,.crow.pane-on{background:var(--secondary-container);color:var(--on-secondary-container)}
.li.deckrow.pane-on .t2,.crow.pane-on .due{color:var(--on-secondary-container)}

@media (orientation:portrait){
  #app{max-width:none;box-shadow:none}
}
/* bottom sheets stay readable on wide screens */
@media (min-width:700px){
  .sheet{max-width:640px;margin:0 auto}
}
/* mouse and trackpad: show slim scrollbars again */
@media (hover:hover) and (pointer:fine){
  .scroll,.sheet .sh-body,.st-card,.chips.scrollx,.hscroll{scrollbar-width:thin;scrollbar-color:var(--outline-variant) transparent}
  .scroll::-webkit-scrollbar,.st-card::-webkit-scrollbar,.chips.scrollx::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:block;width:12px;height:12px}
  .scroll::-webkit-scrollbar-thumb,.st-card::-webkit-scrollbar-thumb,.chips.scrollx::-webkit-scrollbar-thumb,.hscroll::-webkit-scrollbar-thumb{background:var(--outline-variant);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  .scroll::-webkit-scrollbar-track,.st-card::-webkit-scrollbar-track{background:transparent}
}

@media (orientation:landscape) and (min-width:900px) and (min-height:500px){
  body{background:var(--bg)}
  #app{max-width:none;box-shadow:none}

  /* navigation rail */
  #navbar{position:absolute;left:0;top:0;bottom:0;width:var(--rail-w);height:auto;flex-direction:column;align-items:stretch;gap:12px;padding:28px 0 20px}
  .nav-i{flex:none;justify-content:center;min-height:56px}
  .nav-i.rail-only{display:flex;margin-top:auto}
  #app.in-settings .nav-i[data-nav][aria-current="page"]{color:var(--on-surface-variant);font-weight:550}
  #app.in-settings .nav-i[data-nav][aria-current="page"] .ind{color:inherit}
  #app.in-settings .nav-i[data-nav][aria-current="page"] .ind::after{transform:scaleX(.3);opacity:0}
  #app.in-settings .nav-i[data-nav][aria-current="page"] .ms{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
  #tabs,#pages{position:absolute;top:0;bottom:0;right:0;left:var(--rail-w);flex:none;overflow:hidden}
  #snack{left:calc(var(--rail-w) + 12px)}
  .fab{right:24px;bottom:24px}
  .sync-split{max-width:60cqw}

  /* list and detail: a detail page opened from a list sits beside it */
  #app.has-pane .tab{right:auto;width:var(--list-w)}
  .page.pane{left:var(--list-w);border-left:1px solid var(--outline-variant)}
  #app.has-pane #tabs.cover-x,#app.has-pane #tabs.uncover-x{animation:none}

  /* full pages read as a centered column */
  .page:not(.pane):not(.study) .scroll,.page.study.done .scroll{padding-left:max(0px,calc((100% - 880px) / 2));padding-right:max(0px,calc((100% - 880px) / 2))}
  #app:not(.has-pane) #tab-browse{padding-left:max(0px,calc((100% - 1040px) / 2));padding-right:max(0px,calc((100% - 1040px) / 2))}

  /* study: card on the left, answer buttons in a column on the right */
  .page.study:not(.done){display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,24%,300px);grid-template-rows:64px auto minmax(0,1fr)}
  .page.study:not(.done) .st-top{grid-column:1/-1;grid-row:1}
  .page.study:not(.done) .st-stage{grid-column:1;grid-row:2/4;margin:0 8px 16px 16px;min-height:0}
  .page.study:not(.done) .st-counts{grid-column:2;grid-row:2;flex-wrap:wrap;padding:4px 16px 12px 8px}
  .page.study:not(.done) .st-bottom{grid-column:2;grid-row:3;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;padding:0 16px 16px 8px}
  .page.study:not(.done) .st-bottom>.btn.l{height:auto;min-height:112px;flex-direction:column;gap:6px;white-space:normal;text-align:center;border-radius:32px}
  .page.study:not(.done) .st-bottom>.btn.l:active{border-radius:20px}
  .page.study:not(.done) .grades{flex-direction:column;gap:4px}
  .page.study:not(.done) .grades button{flex:none;height:auto;min-height:clamp(64px,13vh,96px)}
  .page.study:not(.done) .grades button:first-child{border-radius:28px 28px 10px 10px}
  .page.study:not(.done) .grades button:last-child{border-radius:10px 10px 28px 28px}
  .page.study:not(.done) .grades button:active{flex-grow:0;border-radius:28px}

  /* card template editor: code and preview side by side */
  .tpwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .tpcode{grid-column:1;grid-row:1/3;min-height:0;border-right:1px solid var(--outline-variant)}
  .tpbar{grid-column:2;grid-row:1;border-top:0}
  .tppreview{grid-column:2;grid-row:2;min-height:0;margin:0 12px 12px}

  @container (min-width:760px){
    /* home: progress on the left, deck tree on the right */
    .home-grid{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:start;max-width:1320px;margin:0 auto;padding-right:8px}
    .home-side{position:sticky;top:0}
    .home-main>.sec-t:first-child{margin-top:4px}
    .scroll>.hero{max-width:600px;margin-left:auto;margin-right:auto}
    .chips.scrollx{flex-wrap:wrap;overflow:visible}
    /* stats: four tiles, charts in two columns */
    .stats-wrap{max-width:1320px;margin:0 auto}
    .stats-wrap>.pad{max-width:560px}
    .stats-wrap>.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
    .stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;padding:0 16px;align-items:start}
    .stat-grid .sec-t{margin-left:8px;margin-right:8px}
    .stat-grid .card{margin:0!important}
    .stat-grid .span{grid-column:1/-1}
    .stat-grid .heat{grid-auto-columns:minmax(0,1fr);overflow:visible}
    .stat-grid .heat i{width:auto;height:auto;aspect-ratio:1;border-radius:22%}
  }
  @container (min-width:820px){
    /* deck page shown wide: summary on the left, actions on the right */
    .deck-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start;column-gap:8px}
    .deck-side{position:sticky;top:0}
    .deck-main>.sec-t:first-child{margin-top:8px}
  }
}


/* ============================================================
   Insights — Engram's own statistics (the Anki view is untouched)
   ============================================================ */
/* view switch: a thumb that slides between the two views */
.vsw{position:relative;display:grid;grid-template-columns:1fr 1fr;height:56px;margin:0 16px 12px;padding:4px;border-radius:28px;background:var(--sch)}
.vsw .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:24px;background:var(--primary);
  transition:transform var(--d-xds) var(--e-xds),border-radius var(--d-xfs) var(--e-xfs)}
.vsw[data-v="anki"] .th{transform:translateX(100%)}
.vsw button{position:relative;z-index:1;border:0;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:calc(15px*var(--ts));font-weight:600;color:var(--on-surface-variant);transition:color var(--d-de) var(--e-de)}
.vsw button .ms{font-size:20px}
.vsw button[aria-selected="true"]{color:var(--on-primary)}
.vsw button[aria-selected="true"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.vsw:active .th{border-radius:14px}
.stx-frame{max-width:1320px;margin:0 auto}
.stx-frame>.vsw{max-width:560px}
.vx-r{animation:vxR var(--d-ds) var(--e-ds) both}.vx-l{animation:vxL var(--d-ds) var(--e-ds) both}
@keyframes vxR{from{opacity:0;transform:translateX(28px)}}@keyframes vxL{from{opacity:0;transform:translateX(-28px)}}

.ix-ctl{margin-bottom:10px}
.ix-range{margin-bottom:6px}
.ix-grid{display:flex;flex-direction:column}
.ix-card{margin:0 16px}
.ix-sec .group{margin:0 16px}
.ix-note{margin:28px 24px 0;max-width:62ch}
.ix-foot{margin:8px 24px 0}
.ix-none{padding:20px 0 8px}
.ix-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 32px}
.ix-empty .bd-m{max-width:44ch}

/* hero: the one loud thing on the page */
.ix-hero{margin:8px 16px 0;padding:18px 20px 20px;border-radius:32px;background:var(--primary-container);color:var(--on-primary-container);position:relative;overflow:hidden}
.ix-hero-top{display:flex;align-items:center;gap:8px;margin-right:-12px}
.ix-hero-top .lb-l{flex:1;opacity:.85}
.ix-hero-top .ib{color:inherit;width:40px;height:40px;opacity:.8}
.ix-big{margin-top:2px;font-size:calc(64px*var(--ts));line-height:1.02;font-weight:520;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 118,"ROND" 100}
.ix-big b{font-weight:inherit}
.ix-big i{font-style:normal;font-size:.42em;font-weight:500;letter-spacing:0;margin-left:3px;opacity:.72;font-variation-settings:"wdth" 100}
.ix-cmp{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.ix-cmp .bd-s{opacity:.8}
.ix-delta{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:12px;font-size:calc(12px*var(--ts));font-weight:650;font-variant-numeric:tabular-nums;vertical-align:middle;
  background:color-mix(in oklab,var(--on-primary-container) 12%,transparent)}
.ix-delta .ms{font-size:16px}
.ix-delta.up{background:var(--g-good);color:var(--on-g-good)}
.ix-delta.down{background:var(--g-hard);color:var(--on-g-hard)}
.ix-spark{display:block;width:calc(100% + 40px);height:64px;margin:14px -20px 0}
.ix-spark .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ix-spark .ar{fill:color-mix(in oklab,var(--primary) 16%,transparent)}
.ix-figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:6px;padding-top:16px;border-top:1px solid color-mix(in oklab,var(--on-primary-container) 18%,transparent)}
.ix-figs>div{display:flex;flex-direction:column;min-width:0}
.ix-figs .v{font-size:calc(26px*var(--ts));line-height:1.15;font-weight:520;font-variant-numeric:tabular-nums;letter-spacing:-.015em;font-variation-settings:"wdth" 110}
.ix-figs .v b{font-weight:inherit}
.ix-figs .v i{font-style:normal;font-size:.6em;opacity:.7;margin-left:2px;font-variation-settings:"wdth" 100}
.ix-figs .c{font-size:calc(13px*var(--ts));opacity:.82;display:flex;align-items:center;flex-wrap:wrap;gap:6px}

/* highlights */
.li.ix-hl{min-height:0;padding:14px 16px;align-items:flex-start}
.li.ix-hl .lead{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.li.ix-hl .tx{padding-top:7px;line-height:1.45}
.li.ix-hl:active{border-radius:4px}
.group>.li.ix-hl:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
.group>.li.ix-hl:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}

/* bars */
.ixb{position:relative}
.ixb-read{min-height:1.4em;margin-bottom:8px;transition:color var(--d-de) var(--e-de)}
.ixb-read.live{color:var(--on-surface);font-weight:600}
.ixb-plot{position:relative;height:var(--h)}
.ixb-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:end;gap:clamp(1px,calc(40% / var(--n)),6px)}
.ixb-c{height:100%;display:flex;align-items:flex-end;cursor:pointer;min-width:0}
.ixb-c b{display:block;width:100%;height:max(calc(var(--v) * 100%),4px);border-radius:min(8px,40%) min(8px,40%) 3px 3px;background:var(--secondary-container);transform-origin:bottom;
  transition:background-color var(--d-de) var(--e-de),filter var(--d-de) var(--e-de)}
.ixb-c.z b{height:4px;background:var(--sch);border-radius:2px}
.ixb-c.hi b{background:var(--primary)}
.ixb-c.on b{background:var(--tertiary)}
@media (hover:hover){.ixb-c:hover b{filter:brightness(.94)}}
.ixb.thin .ixb-cols{gap:2px}
.ixb-avg{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in oklab,var(--on-surface-variant) 55%,transparent);z-index:1;pointer-events:none}
.ixb-avg span{position:absolute;right:0;bottom:3px;font-size:11px;font-weight:600;color:var(--on-surface-variant);background:var(--item);padding:0 0 0 6px;border-radius:4px;font-style:normal}
.ixb-x{position:relative;height:18px;margin-top:6px;font-size:11px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.ixb-x span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ixb-x span.first{transform:none;left:0!important}
.ixb-x span.last{transform:none;left:auto!important;right:0}

/* lines */
.ixl-plot{position:relative;height:var(--h);margin-left:40px}
.ixl .ixb-x{margin-left:40px}
.ixl svg{display:block;width:100%;height:100%;overflow:visible}
.ixl .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ixl .ar{fill:color-mix(in oklab,var(--primary) 12%,transparent)}
.ixl .band{fill:color-mix(in oklab,var(--g-good) 55%,transparent)}
.ixl-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--item)}
.ixl-v{position:absolute;transform:translate(-100%,-150%);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;background:var(--item);padding:0 4px;border-radius:4px;white-space:nowrap}
.ixl-hi,.ixl-lo{position:absolute;left:-40px;width:34px;text-align:right;font-size:11px;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.ixl-hi{top:-2px}.ixl-lo{bottom:0}

.ix-rows{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.ix-row{display:flex;align-items:center;gap:12px;font-size:calc(14px*var(--ts))}
.ix-row b{min-width:54px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.ix-meter{flex:0 0 38%;height:10px;border-radius:5px;background:var(--sch);overflow:hidden;display:block}
.ix-meter i{display:block;height:100%;width:var(--w);border-radius:5px;transform-origin:left}
.ix-meter.wide{flex:none;width:100%;height:8px;margin:6px 0 5px}
.ix-meter.wide i{background:oklch(0.62 0.13 var(--c))}
.ix-grades{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;font-size:calc(13px*var(--ts));font-weight:550}
.gchip b{font-variant-numeric:tabular-nums;font-weight:700}
.gchip.g1{background:var(--g-again);color:var(--on-g-again)}.gchip.g2{background:var(--g-hard);color:var(--on-g-hard)}
.gchip.g3{background:var(--g-good);color:var(--on-g-good)}.gchip.g4{background:var(--g-easy);color:var(--on-g-easy)}

/* decks */
.li.ix-deck{align-items:center;gap:14px;cursor:default}
.li.ix-deck:active{border-radius:4px}
.group>.li.ix-deck:first-child{border-top-left-radius:20px;border-top-right-radius:20px}
.group>.li.ix-deck:last-child{border-bottom-left-radius:20px;border-bottom-right-radius:20px}
.li.ix-deck .shp{width:40px;height:40px}.li.ix-deck .shp .ms{font-size:20px}

/* consistency: streaks + calendar */
.ix-streaks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ix-streak{display:flex;align-items:center;gap:12px;min-width:0}
.ix-streak .shp{width:48px;height:48px}
.ix-streak>span:last-child{display:flex;flex-direction:column;min-width:0}
.ix-streak b{font-size:calc(28px*var(--ts));line-height:1.1;font-weight:520;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 112}
.ix-streak:not(.lit):first-child .shp{filter:grayscale(1);opacity:.55}
.ix-cal-h{display:flex;align-items:center;gap:4px;margin:0 -12px 6px}
.ix-cal-h .grow{text-align:center}
.ix-cal-h .ib:disabled{opacity:.3;cursor:default}
.ix-cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ix-cal-g .wh{text-align:center;font-size:11px;font-weight:600;color:var(--on-surface-variant);padding-bottom:4px}
.ix-cal-g .d{position:relative;aspect-ratio:1;width:100%;max-width:52px;justify-self:center;margin:0;border:0;padding:0;border-radius:50%;display:grid;place-items:center;
  background:transparent;color:var(--on-surface-variant);font-size:calc(13px*var(--ts));font-weight:550;font-variant-numeric:tabular-nums}
.ix-cal-g .d.pad{visibility:hidden}
.ix-cal-g .d.fut{opacity:.35;cursor:default}
.ix-cal-g .d.on{background:color-mix(in oklab,var(--primary) calc(14% + var(--f) * 38%),var(--sch));color:var(--on-surface)}
.ix-cal-g .d .dn{position:relative;z-index:1}
.ix-cal-g .d .gs{position:absolute;inset:-2px;display:block}
.ix-cal-g .d .gs svg{width:100%;height:100%;display:block}
.ix-cal-g .d .gs path{fill:var(--primary)}
.ix-cal-g .d.goal{background:transparent;color:var(--on-primary);font-weight:700}
.ix-cal-g .d .pf{position:absolute;left:24%;right:24%;bottom:14%;height:3px;border-radius:2px;background:color-mix(in oklab,var(--on-surface) 12%,transparent);overflow:hidden}
.ix-cal-g .d .pf::after{content:"";position:absolute;inset:0;right:auto;width:calc(var(--f) * 100%);background:var(--primary);border-radius:2px}
.ix-cal-g .d.today{box-shadow:0 0 0 2px var(--tertiary)}
.ix-cal-g .d.today.goal{box-shadow:none}
.ix-cal-g .d.today.goal .gs{filter:drop-shadow(0 0 0 var(--tertiary))}
.ix-cal-g .d.today.goal::before{content:"";position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--tertiary)}
.ix-cal-g .d:not(.fut):not(.pad){cursor:pointer;transition:transform var(--d-xfs) var(--e-xfs)}
.ix-cal-g .d:not(.fut):not(.pad):active{transform:scale(.88)}
.ix-cal-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;align-items:center}
.ix-cal-key span{display:inline-flex;align-items:center;gap:6px}
.ix-cal-key span:last-child{margin-left:auto}
.ix-cal-key i{width:14px;height:14px;border-radius:50%;display:inline-block}
.ix-cal-key .k0{background:color-mix(in oklab,var(--primary) 30%,var(--sch))}
.ix-cal-key .k1 svg{width:14px;height:14px;display:block}.ix-cal-key .k1 path{fill:var(--primary)}

/* sessions */
.ix-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ix-trio>div{display:flex;flex-direction:column;min-width:0}
.ix-trio b{font-size:calc(22px*var(--ts));line-height:1.2;font-weight:520;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 110}
.ix-sess{display:flex;flex-direction:column;margin-top:14px}
.ix-s{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when num" "what num";column-gap:12px;padding:10px 0;border-top:1px solid var(--outline-variant)}
.ix-s .when{grid-area:when;display:flex;align-items:baseline;gap:8px;min-width:0}
.ix-s .when b{font-weight:600;font-size:calc(14px*var(--ts))}
.ix-s .what{grid-area:what;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ix-s .what .ms{font-size:14px}
.ix-s .num{grid-area:num;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.ix-s .num b{font-variant-numeric:tabular-nums;font-weight:650}
.ix-s.long .num b{color:var(--primary)}

.lead.ix-sinkn{font-weight:700;font-variant-numeric:tabular-nums;background:var(--secondary-container);color:var(--on-secondary-container)}

/* records */
.ix-recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px}
.ix-rec{background:var(--item);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ix-rec .shp{width:40px;height:40px;margin-bottom:8px}.ix-rec .shp .ms{font-size:20px}
.ix-rec b{font-size:calc(18px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}

/* day sheet */
.ix-daygoal{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--sch)}
.ix-daygoal .shp{width:40px;height:40px}.ix-daygoal .shp .ms{font-size:20px}
.ix-daygoal.met{background:var(--g-good);color:var(--on-g-good)}
.ix-daygoal.met .muted{color:inherit;opacity:.8}

/* the one orchestrated entrance: sections rise in order, bars grow, lines draw, calendar ripples out from today */
.ix-intro .ix-sec{animation:ixRise var(--d-ds) var(--e-ds) backwards;animation-delay:calc(var(--i,0) * 55ms)}
.ix-intro .ixb-c b{animation:ixGrow var(--d-ss) var(--e-xds) backwards;animation-delay:calc(160ms + var(--i,0) * 14ms)}
.ix-intro .ixl-plot svg,.ix-intro .ix-spark{animation:ixDraw 900ms var(--e-ds) backwards .18s}
.ix-intro .ixl-dot,.ix-intro .ixl-v{animation:fade 300ms linear backwards .9s}
.ix-intro .ix-cal-g .d:not(.pad){animation:ixPop var(--d-xfs) var(--e-xfs) backwards;animation-delay:calc(220ms + var(--k,0) * 16ms)}
.ix-intro .ix-meter i{animation:ixGrowX var(--d-ss) var(--e-xds) backwards .3s}
.ix-cal-g.vx-l .d:not(.pad),.ix-cal-g.vx-r .d:not(.pad){animation:fade 240ms linear backwards}
.ix-cal-g.vx-l{animation:vxL var(--d-ds) var(--e-ds) both}.ix-cal-g.vx-r{animation:vxR var(--d-ds) var(--e-ds) both}
@keyframes ixRise{from{opacity:0;transform:translateY(22px)}}
@keyframes ixGrow{from{transform:scaleY(0)}}
@keyframes ixGrowX{from{transform:scaleX(0)}}
