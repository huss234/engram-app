@keyframes ixDraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ixPop{from{opacity:0;transform:scale(.4)}}

/* ---------- home: momentum widget ---------- */
.mo{margin:8px 16px 0;padding:16px 16px 14px;border-radius:28px;background:var(--item);display:flex;flex-direction:column;gap:14px;cursor:pointer;
  transition:border-radius var(--d-xfs) var(--e-xfs)}
.mo:active{border-radius:18px}
.mo-top{display:flex;align-items:center;gap:12px}
.mo-top>.ms{flex:none}
.mo-flame{width:44px;height:44px}.mo-flame .ms{font-size:22px}
.mo-flame:not(.lit){filter:grayscale(1);opacity:.55}
.mo-streak{font-size:calc(16px*var(--ts));font-weight:550}
.mo-streak b{font-size:calc(22px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 112}
.mo-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mo-d{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.mo-d i{width:100%;max-width:32px;aspect-ratio:1;border-radius:50%;background:var(--sch);display:block}
.mo-d.on i{background:color-mix(in oklab,var(--primary) calc(18% + var(--f) * 40%),var(--sch))}
.mo-d svg{position:absolute;top:0;width:100%;max-width:32px;aspect-ratio:1;z-index:1}
.mo-d svg path{fill:var(--primary)}
.mo-d.goal i{background:transparent}
.mo-d em{font-style:normal;font-size:11px;font-weight:600;color:var(--on-surface-variant)}
.mo-d.today em{color:var(--primary)}
.mo-d.today i{box-shadow:0 0 0 2px var(--tertiary)}
.mo-d.today.goal i{box-shadow:none}
.mo-goal{display:flex;flex-direction:column;gap:6px}
.mo-bar{height:10px;border-radius:5px;background:var(--sch);overflow:hidden}
.mo-bar i{display:block;height:100%;width:calc(var(--f) * 100%);min-width:0;border-radius:5px;background:var(--primary);transition:width var(--d-ss) var(--e-ss)}
.mo-goal b{font-weight:650;font-variant-numeric:tabular-nums}
.mo-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--outline-variant)}
.mo-figs>div{display:flex;flex-direction:column;min-width:0}
.mo-figs .v{font-size:calc(20px*var(--ts));line-height:1.2;font-weight:560;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:1px;flex-wrap:wrap;font-variation-settings:"wdth" 110}
.mo-figs .v i{font-style:normal;font-size:.62em;color:var(--on-surface-variant);margin-left:1px;font-variation-settings:"wdth" 100}
.mo-tr{display:inline-flex;align-items:center;font-size:11px;font-weight:650;margin-left:6px;padding:1px 5px 1px 2px;border-radius:8px;font-variation-settings:"wdth" 100}
.mo-tr .ms{font-size:13px}
.mo-tr.up{background:var(--g-good);color:var(--on-g-good)}
.mo-tr.down{background:var(--g-hard);color:var(--on-g-hard)}

/* ---------- study: session clock and pause ---------- */
.st-clock{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;margin:0 2px;border:0;border-radius:18px;
  background:var(--secondary-container);color:var(--on-secondary-container);font-size:calc(13px*var(--ts));font-weight:650;font-variant-numeric:tabular-nums;
  transition:border-radius var(--d-xfs) var(--e-xfs),background-color var(--d-de) var(--e-de),color var(--d-de) var(--e-de)}
.st-clock .ms{font-size:18px}
.st-clock:active{border-radius:10px}
.st-clock.paused{background:var(--primary);color:var(--on-primary)}
.st-clock.idle{background:var(--sch);color:var(--on-surface-variant)}
.st-pause{position:absolute;inset:0;z-index:5;border-radius:32px;display:grid;place-items:center;padding:24px;
  background:color-mix(in oklab,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fade var(--d-de) var(--e-de) both}
.st-pause.out{animation:fadeOut 200ms linear both}
.st-pause-in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.st-pause-in .shp{animation:shapeIn var(--d-xds) var(--e-xds) both;margin-bottom:8px}
.st-pclock{font-size:calc(56px*var(--ts));line-height:1.05;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 115}
.st-pause-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.page.study.paused .st-bottom,.page.study.paused .st-counts{opacity:.35;pointer-events:none;transition:opacity var(--d-de) var(--e-de)}
.sum-tiles{grid-template-columns:1fr 1fr}
.sum-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 16px 4px}
.sum-note{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--tertiary-container);color:var(--on-tertiary-container);font-size:calc(13px*var(--ts));font-weight:600}
.sum-note .ms{font-size:18px}

@media (prefers-reduced-motion:reduce){
  .ix-intro *,.vx-r,.vx-l,.ix-cal-g.vx-l,.ix-cal-g.vx-r{animation:none!important}
  .vsw .th{transition:none}
}
@media (max-width:360px){
  .st-clock{padding:0 8px}.st-clock .ms{display:none}
  .ix-big{font-size:calc(52px*var(--ts))}
}
/* wide: insights in two columns, hero across the top */
@container (min-width:700px){
  .ix-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;padding:0 16px;align-items:start}
  .ix-grid .span{grid-column:1/-1}
  .ix-grid .ix-card,.ix-grid .ix-sec .group,.ix-grid .ix-recs,.ix-grid .ix-hero{margin-left:0;margin-right:0}
  .ix-grid .sec-t{margin-left:8px;margin-right:8px}
  .ix-grid .ix-foot{margin-left:8px}
  .ix-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:32px;padding:22px 28px 24px}
  .ix-hero>.ix-hero-top,.ix-hero>.ix-big,.ix-hero>.ix-cmp{grid-column:1}
  .ix-hero>.ix-spark{grid-column:1;width:calc(100% + 28px);margin-left:-28px;margin-right:0}
  .ix-hero>.ix-figs{grid-column:2;grid-row:1/5;align-self:center;border-top:0;padding-top:0;border-left:1px solid color-mix(in oklab,var(--on-primary-container) 18%,transparent);padding-left:28px;gap:22px 16px}
  .ix-big{font-size:calc(80px*var(--ts))}
  .ix-recs{grid-template-columns:1fr 1fr}
  .ix-range{flex-wrap:wrap}
  .stx-frame .ix-ctl{max-width:560px}
}
</style>
</head>

  <div id="tabs">
    <section class="tab" id="tab-decks" data-tab="decks"></section>
    <section class="tab" id="tab-browse" data-tab="browse"></section>
    <section class="tab" id="tab-stats" data-tab="stats"></section>
  </div>
  <nav id="navbar" aria-label="Main">
    <button class="nav-i" data-nav="decks"><span class="ind"><span class="ms">style</span></span><span class="badge hidden" id="nav-badge"></span>Decks</button>
    <button class="nav-i" data-nav="browse"><span class="ind"><span class="ms">manage_search</span></span>Browse</button>
    <button class="nav-i" data-nav="stats"><span class="ind"><span class="ms">insights</span></span>Stats</button>
    <button class="nav-i rail-only" data-act="rail-settings"><span class="ind"><span class="ms">settings</span></span>Settings</button>
  </nav>
  <div id="pages"></div>
  <div id="overlays"></div>
  <div id="snack"></div>
</div>

  /* apply one file from the repo, by path */

async function syncNow() {
  if (!Sync.enabled()) return openSetup();
  if (Sync.status === 'choice') return resolveChoices();
  if (Sync.status === 'auth') return openTokenRenew();
  if (navigator.onLine === false) return snack(`You are offline. ${plural(Sync.waitingCount(), 'change')} will sync when you reconnect.`);
  const r = await Sync.run({ reason: 'manual' });
  if (!r) return;
  if (r.error) {
    const e = r.error;
    if (e.kind === 'rate') snack(`GitHub asked us to wait ${Math.max(1, Math.ceil((e.until - Date.now()) / 60000))} min. Nothing is lost; it will retry.`);
    else if (e.kind === 'auth') snack('GitHub did not accept the token.', 'Fix', openTokenRenew, 8000);
    else snack('Sync paused: ' + e.message, 'Details', openSyncSheet, 7000);
    return;
  }
  snack(Sync.waitingCount() ? `Synced · ${fmtNum(r.sent)} sent, ${fmtNum(r.received)} received · images still uploading` : `Synced · ${plural(r.sent, 'change')} sent, ${fmtNum(r.received)} received`);
  backupNag();
}
function backupNag() {
  const last = Math.max(Col.conf.lastBackup || 0, Sync.st.lastBackupNag || 0);
  if (Col.notes.size && Date.now() - last > 14 * DAY) { Sync.st.lastBackupNag = Date.now(); Sync.saveState(); setTimeout(() => snack('Tip: keep a backup copy (.colpkg) in Google Drive too.', 'Download', () => ACT.backup(), 9000), 4500); }
}

async function setupConnect(pg) {
  const s = pg.state; s.owner = s.owner.replace(/^@/, '').trim(); s.token = s.token.trim();
  if (!s.owner || !s.token) { s.err = 'Enter your GitHub username and paste the token.'; return pg.refresh(); }

  const fail = msg => { s.step = 'form'; s.err = msg; pg.refresh(); };
  try {
    GH.configure(s.owner, s.token);
    const u = await GH.user();
    if (u && u.login && u.login.toLowerCase() !== s.owner.toLowerCase()) return fail(`This token belongs to <b>${esc(u.login)}</b>, not ${esc(s.owner)}.`);
    const owner = (u && u.login) || s.owner; GH.configure(owner, s.token);
    const dataName = Sync.st.dataRepo || 'engram-data';
    const data = await GH.repo(dataName);
    if (!data) return fail(`Could not find the repository <b>${esc(dataName)}</b>. Create it (private), and give the token access to <b>All repositories</b>.`);
    const media = []; for (let i = 1; i < 100; i++) { const name = 'engram-media-' + String(i).padStart(2, '0'); const r = await GH.repo(name); if (!r) break; media.push(r); }
    if (!media.length) return fail('Could not find <b>engram-media-01</b>. Create it as a private repository.');
    let meta = null;
    const h = await GH.head(dataName, { conditional: false });
    if (h.oid) { const tr = await GH.tree(dataName, h.oid); if (tr.files.some(f => f.path === 'meta.json')) meta = JSON.parse((await GH.readFiles(dataName, h.oid, ['meta.json']))['meta.json']); }
    s.found = { login: owner, data, media, meta }; s.owner = owner; s.step = 'found'; pg.refresh();
  } catch (e) {
    console.warn(e);
    fail(e.kind === 'auth' ? 'GitHub did not accept this token. Check that you copied all of it.' : e.kind === 'offline' || e.kind === 'net' ? 'No connection to GitHub. Check the internet and try again.' : esc(e.message));
  }
}
async function setupGo(pg, mode) {
  const s = pg.state, f = s.found;
  if (mode === 'replace' && Col.notes.size && !await confirmDlg('Use GitHub’s copy?', `The ${plural(Col.notes.size, 'note')} on this device are replaced by the collection on GitHub.`, 'Replace', true, 'cloud_download')) return;
  s.step = 'working'; s.progress = 'Saving the token on this device…'; pg.refresh();
  const prog = t => { s.progress = t; const e = pg.el.querySelector('[data-prog]'); if (e) e.textContent = t; };
  try {
    const st = Sync.st;
    st.owner = s.owner; st.mediaRepos = f.media.map(m => m.name); st.mediaRepo = st.mediaRepos[st.mediaRepos.length - 1];
    st.repoSizes = Object.fromEntries(f.media.map(m => [m.name, (m.size || 0) * 1024])); st.repoCheckedAt = Date.now();
    st.tokenExpires = GH.expiresAt || s.expires || (Date.now() + 366 * DAY); st.seenSetup = true;
    st.lastOid = null; st.snapshotAt = 0; st.lastSyncAt = 0;

    await Store.kvSet('ghToken', s.token); await Sync.saveState();
    Sync.shadow = Sync.emptyShadow(); Sync.graves = new Map();
    if (mode === 'replace') {
      const h = await GH.head(st.dataRepo, { conditional: false });

      await Sync.fullDownload(h.oid, { mode: 'replace', onProgress: (d, n) => prog(`Downloading your collection… ${d} / ${n} files`) });
      prog('Saving on this device…');
      await Store.flush();
      st.lastSyncAt = Date.now(); await Sync.saveState();
    } else {
      /* everything local counts as new: merge or first upload */
      Col.markAll(); await Store.flush();
      prog(mode === 'upload' ? 'Uploading your collection…' : 'Merging…');
      const off = () => { const p = Sync.progress; if (p) prog(`${p.what}… ${Math.round(100 * p.done / Math.max(1, p.total))}%`); };
      Sync.listeners.add(off);

      Sync.listeners.delete(off);
      if (r && r.error) throw r.error;
    }
    await ensureMediaHashes();
    closePage(pg); App.refreshAll(); Sync.refreshState();
    snack(mode === 'upload' ? 'Connected. Your collection is on GitHub.' : 'Connected. This device is in sync.');

  } catch (e) {
    console.error(e); s.step = 'found'; pg.refresh();
    openDialog({ icon: 'error', title: 'Setup stopped', body: esc(e.message || String(e)) + '<br><br>Nothing was lost. You can try again.', actions: [{ label: 'OK', value: true }] });
  }
}
/* media stored before sync existed: give it a hash and queue it */
async function ensureMediaHashes() {
  let n = 0;
  for (const [name, e] of Col.media) {
    if (e.sha1 && (e.repo || MediaSync.queuedNames.has(name))) continue;
    const b = await Store.getMedia(name); if (!b) continue;
    await Store.putMedia(name, new Uint8Array(await b.arrayBuffer()), { keepMod: true }); n++;
  }
  if (n) { await Store.flush(); Sync.mediaPending = await MediaSync.pendingCount(); Sync.refreshState(); }
  return n;
}

/* ---------------- second device: QR code or setup code ---------------- */
const setupCode = () => 'ENGRAM1:' + btoa(JSON.stringify({ u: Sync.st.owner, t: Sync.token, e: Sync.tokenExpiry() || 0, d: Sync.st.dataRepo }));
function parseSetupCode(txt) {

  try { const o = JSON.parse(atob(m[1])); return o.u && o.t ? { owner: o.u, token: o.t, expires: o.e || 0, dataRepo: o.d } : null; } catch (e) { return null; }
}

    onMount(sh) { sh.querySelector('[data-copycode]').onclick = async () => { try { await navigator.clipboard.writeText(code); snack('Setup code copied'); } catch (e) { promptDlg('Setup code', code, { multiline: true, ok: 'Done' }); } }; } });

async function scanSetup(pg) {
  const use = info => { if (!info) return snack('That is not an Engram setup code.'); if (info.dataRepo) Sync.st.dataRepo = info.dataRepo; pg.state.owner = info.owner; pg.state.token = info.token; pg.state.expires = info.expires; pg.refresh(); setupConnect(pg); };
  const typeIt = async () => { const v = await promptDlg('Paste the setup code', '', { multiline: true, help: 'On the first device: Settings → Sync → Set up another device → Copy as text.', ok: 'Use' }); if (v) use(parseSetupCode(v)); };
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) return typeIt();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { return typeIt(); }
  const det = new BarcodeDetector({ formats: ['qr_code'] }); let done = false;
  const sh = openSheet({ title: 'Scan the code', body: `<video class="qrcam" playsinline muted></video><button class="btn text block" data-typeit>Paste the code instead</button>`,
    onMount(el) { const v = el.querySelector('video'); v.srcObject = stream; v.play(); el.querySelector('[data-typeit]').onclick = () => { done = true; sh.closeNow(); typeIt(); };
      const tick = async () => { if (done || !el.isConnected) return; try { const r = await det.detect(v); const hit = r.map(x => parseSetupCode(x.rawValue)).find(Boolean); if (hit) { done = true; sh.closeNow(); use(hit); return; } } catch (e) { } setTimeout(tick, 250); };
      tick(); },
    onClose() { done = true; stream.getTracks().forEach(t => t.stop()); } });

/* ---------------- verify, restore, reset ---------------- */
function remoteModel(texts, paths) {
  const R = { n: new Map(), c: new Map(), d: new Map(), m: new Map(), p: new Map(), f: new Map(), x: new Map(), r: new Map(), g: new Map() };
  const better = (old, mod, val) => !old || mod > old[0] || (mod === old[0] && recHash(val) > recHash(old[1]));
  const put = (t, id, val, mod) => { const o = R[t].get(id); if (better(o, mod, val)) R[t].set(id, [mod, val]); };
  for (const p of paths) {
    const txt = texts[p]; if (txt == null || p === 'meta.json') continue; const o = JSON.parse(txt);
    const q = p.slice(11);
    if (p.startsWith('journal/')) {
      for (const t of ['d', 'm', 'p']) for (const [id, v] of Object.entries(o[t] || {})) put(t, id, v, v.mod || 0);
      for (const [id, a] of Object.entries(o.n || {})) put('n', id, a, a[2]); for (const [id, a] of Object.entries(o.c || {})) put('c', id, a, a[3]);
      for (const a of o.r || []) R.r.set(String(a[0]), [0, a]); for (const [k, v] of Object.entries(o.x || {})) put('x', k, v, v.mod || 0);
      for (const [k, v] of Object.entries(o.f || {})) put('f', k, v[0], v[1]);
      for (const [k, m] of Object.entries(o.g || {})) if (!R.g.has(k) || m > R.g.get(k)) R.g.set(k, m);
    } else if (q.startsWith('notes/')) { for (const [id, a] of Object.entries(o)) put('n', id, a, a[2]); }
    else if (q.startsWith('cards/')) { for (const [id, a] of Object.entries(o)) put('c', id, a, a[3]); }
    else if (q.startsWith('revlog/')) { for (const a of o) R.r.set(String(a[0]), [0, a]); }
    else if (q.startsWith('media-index/')) { for (const [k, v] of Object.entries(o)) put('x', k, v, v.mod || 0); }
    else if (q === 'decks.json') { for (const [id, v] of Object.entries(o)) put('d', id, v, v.mod || 0); }
    else if (q === 'notetypes.json') { for (const [id, v] of Object.entries(o)) put('m', id, v, v.mod || 0); }
    else if (q === 'presets.json') { for (const [id, v] of Object.entries(o)) put('p', id, v, v.mod || 0); }
    else if (q === 'config.json') { for (const [k, v] of Object.entries(o.conf || {})) put('f', k, v, (o.mods || {})[k] || 0); }
    else if (q === 'graves.json') { for (const [k, m] of Object.entries(o)) if (!R.g.has(k) || m > R.g.get(k)) R.g.set(k, m); }
  }
  for (const [k, m] of R.g) { const t = k[0], id = k.slice(2), o = R[t] && R[t].get(id); if (o && (t === 'r' || o[0] <= m)) R[t].delete(id); }
  return R;
}
async function verifyEverything() {

  const prog = t => { const e = wait.el.querySelector('[data-prog]'); if (e) e.textContent = t; };

    await Sync.run({ reason: 'manual' });
    const h = await GH.head(Sync.st.dataRepo, { conditional: false });
    const { texts, paths } = await Sync.fullDownload(h.oid, { dry: true, onProgress: (d, n) => prog(`Reading GitHub… ${d} / ${n} files`) });
    prog('Comparing…'); await nextFrame();
    const R = remoteModel(texts, paths);
    const rows = []; let bad = 0;
    const cmpMap = (label, t, local, encode) => {
      let diff = 0, pend = 0;
      for (const [id, v] of local) { const r = R[t].get(String(id)); if (Sync.ob.has(t + ':' + id)) { pend++; continue; } if (!r || recHash(r[1]) !== recHash(encode(v))) diff++; }
      for (const id of R[t].keys()) if (!local.has(t === 'n' || t === 'c' ? +id : id) && !Sync.ob.has(t + ':' + id)) diff++;
      bad += diff; rows.push([label, local.size, R[t].size, diff, pend]);
    };
    cmpMap('Notes', 'n', Col.notes, Enc.n.bind(Enc)); cmpMap('Cards', 'c', Col.cards, Enc.c.bind(Enc));
    cmpMap('Decks', 'd', new Map(Object.entries(Col.decks)), x => x); cmpMap('Note types', 'm', new Map(Object.entries(Col.models)), x => x); cmpMap('Presets', 'p', new Map(Object.entries(Col.dconf)), x => x);
    const lm = new Map([...Col.media].filter(([, v]) => v.repo)); cmpMap('Images', 'x', new Map([...lm, ...[...Sync.trash].filter(([, v]) => v.repo)]), x => x);
    let rdiff = 0; const lr = new Set(); for (const r of Col.revlog) { lr.add(String(r.id)); if (!R.r.has(String(r.id)) && !Sync.ob.has('r:' + r.id)) rdiff++; } for (const id of R.r.keys()) if (!lr.has(id)) rdiff++;
    bad += rdiff; rows.push(['Reviews', Col.revlog.length, R.r.size, rdiff, 0]);
    wait.closeNow();
    Sync.log1(bad ? `Verify: ${plural(bad, 'difference')} found` : 'Verify: everything matches GitHub');
    const v = await openDialog({ icon: bad ? 'report' : 'verified', title: bad ? `${plural(bad, 'difference')} found` : 'Everything matches',
      body: `<div class="infotable"><div><span class="muted"></span><span class="muted">device · GitHub</span></div>${rows.map(([l, a, b, d, p]) => `<div><span class="muted">${l}</span><span>${fmtNum(a)} · ${fmtNum(b)} ${d ? `<b style="color:var(--error)">${fmtNum(d)} differ</b>` : '✓'}${p ? ` · ${fmtNum(p)} waiting` : ''}</span></div>`).join('')}</div>${bad ? '<div class="bd-s muted" style="margin-top:10px">Repair downloads GitHub’s copy and merges it in. Your waiting changes are kept.</div>' : ''}`,
      actions: bad ? [{ label: 'Close', value: false }, { label: 'Repair', value: true }] : [{ label: 'OK', value: false }] });
    if (v) { const w2 = openSheet({ title: 'Repairing', body: `<div class="empty">${loaderHtml()}</div>` }); startLoaders(w2.el); try { await Sync.fullDownload(h.oid, { mode: 'merge' }); Sync.rebuildShadowFromLocal(); Col.markAll(); await Store.flush(); await Sync.run({ reason: 'manual' }); } finally { w2.closeNow(); } App.refreshAll(); snack('Repaired'); }
  } catch (e) { wait.closeNow(); snack('Could not verify: ' + e.message); }
}

Sync.restoreTo = async function (oldOid) {
  const head = (await GH.head(this.st.dataRepo, { conditional: false })).oid;
  const cur = await this.fullDownload(head, { dry: true });
  const now = remoteModel(cur.texts, cur.paths);
  await this.fullDownload(oldOid, { mode: 'replace' });
  let gmax = 0; for (const [k, m] of now.g) if ('ncdmp'.includes(k[0]) && m > gmax) gmax = m;
  const t = Math.max(nowSecs(), gmax + 1), ms = Date.now();
  for (const n of Col.notes.values()) n.mod = t; for (const c of Col.cards.values()) c.mod = t;
  for (const o of [Col.decks, Col.models, Col.dconf]) for (const v of Object.values(o)) v.mod = t;
  for (const v of Col.media.values()) v.mod = ms; for (const v of this.trash.values()) v.mod = ms;
  const dels = [];
  for (const id of now.n.keys()) if (!Col.notes.has(+id)) dels.push(['n:' + id, t]);
  for (const id of now.c.keys()) if (!Col.cards.has(+id)) dels.push(['c:' + id, t]);
  for (const t2 of ['d', 'm', 'p']) { const obj = t2 === 'd' ? Col.decks : t2 === 'm' ? Col.models : Col.dconf; for (const id of now[t2].keys()) if (!(id in obj)) dels.push([t2 + ':' + id, t]); }
  const lr = new Set(Col.revlog.map(r => String(r.id))); for (const id of now.r.keys()) if (!lr.has(id)) dels.push(['r:' + id, t]);
  for (const k of now.x.keys()) if (!Col.media.has(k) && !this.trash.has(k)) dels.push(['x:' + k, ms]);
  this.st.lastOid = head; this.shadow = this.emptyShadow();

  for (const [k, m] of dels) { const e = { k, op: 'del', mod: m, seq: this.nextSeq(), at: ms }; this.ob.set(k, e); tx.objectStore('outbox').put(e); }
  await new Promise(r => tx.oncomplete = r);
  Col.markAll(); await Store.flush(); await this.saveState();
  const r = await this.run({ reason: 'manual' }); if (r && r.error) throw r.error;
};

async function saveFile(name, data) {
  const blob = data instanceof Blob ? data : new Blob([data]);
  /* desktop Chrome: write straight to a file the person picks (streams big files) */
  if (window.showSaveFilePicker && blob.size > 50 * 1048576) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name });
      const w = await h.createWritable(); await blob.stream().pipeTo(w);
      return { ok: true, name };
    } catch (e) { if (e && e.name === 'AbortError') return { ok: false, cancelled: true }; }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    return { ok: true, name };
  } catch (e) { return { ok: false, error: e.message }; }
}

    onClose: (p) => { Session.end(p); document.removeEventListener('keydown', p.keys); clearTimeout(p.autoTimer); clearInterval(p.tick); window.EngramCard = { tap() { }, enter() { }, loaded() { } }; Sched.stop(); if (p.answered) snack(`Progress saved · ${plural(p.answered, 'answer')}`); Store.flush(); },
  });
  pg.state.did = +did; pg.answered = 0; pg.stats = { a: 0, h: 0, g: 0, e: 0, t: 0 };
  pg.el.classList.add('study');
  Session.begin(pg, did);
  pg.keys = e => {
    if (App.pages[App.pages.length - 1] !== pg || $('#overlays').children.length || (e.target.matches && e.target.matches('input,textarea,select,[contenteditable]'))) return;
    if (pg.finished) return;
    const k = e.key; pg.poke && pg.poke();
    if (pg.paused) { if (k === ' ' || k === 'Enter' || k === 'p') { e.preventDefault(); Session.resume(pg); } return; }
    if (k === 'p') { Session.pause(pg); return; }

    else if (pg.revealed && ['1', '2', '3', '4'].includes(k)) grade(pg, +k);
    else if (k === 'z' || k === 'u') doUndo(pg);
    else if (k === 'e') editCurrent(pg);
    else if (k === '-') studyAction(pg, 'bury-card');
    else if (k === '=') studyAction(pg, 'bury-note');
    else if (k === '@') studyAction(pg, 'suspend-card');
    else if (k === '!') studyAction(pg, 'suspend-note');
    else if (k === '*') studyAction(pg, 'mark');
    else if (k === 'r' || k === 'F5') { e.preventDefault(); replay(pg); }
    else if (e.ctrlKey && /^[0-7]$/.test(k)) { e.preventDefault(); setFlagCur(pg, +k); }
  };

    tap: () => { pg.poke && pg.poke(); if (!pg.revealed && !pg.finished) reveal(pg); },
    enter: () => { if (!pg.revealed) reveal(pg); },
    loaded: () => { },
  };

}

function displayHtml(html) {

  return String(html || '').replace(/<img\b([^>]*?)\ssrc\s*=\s*(["']?)([^"'>\s]+)\2([^>]*)>/gi, (m, a, q, src, b) => {
    let name = src; try { name = decodeURIComponent(src); } catch (e) { }
    const u = Media.urls.get(name);
    return u ? `<img${a} src="${u}" data-mref="${esc(src)}"${b}>` : m;
  });
}
function storedHtml(el) {

  let h = el.innerHTML.replace(/<img\b[^>]*>/gi, tag => {
    const m = tag.match(/\sdata-mref="([^"]*)"/); if (!m) return tag;
    return tag.replace(/\sdata-mref="[^"]*"/, '').replace(/\ssrc="[^"]*"/, ` src="${m[1]}"`);

}

    f.addEventListener('focus', () => { lastFocus = f; });

function pickFile(cb) { const inp = $('#file-in'); inp.value = ''; inp.onchange = () => { const f = inp.files[0]; if (f) cb(f); }; inp.click(); }
async function readImportFile(pg, f) {
  const s = pg.state; s.busy = 'Reading ' + f.name; pg.refresh(); await nextFrame();
  try {
    const head = new Uint8Array(await f.slice(0, 16).arrayBuffer());
    s.fileName = f.name;
    if (AnkiIO.isZip(head) || /\.(apkg|colpkg|anki2|anki21)$/i.test(f.name)) {
      s.pkg = await AnkiIO.openPackage(f, f.name);
      s.mode = s.pkg.kind === 'colpkg' ? (Col.notes.size ? 'replace' : 'replace') : 'merge';
      s.opts = { withSched: true, updateNotes: 'newer', updateNotetypes: 'newer', updateCards: true };
    } else {
      const text = new TextDecoder().decode(new Uint8Array(await f.arrayBuffer()));
      const t = text.trim();
      if ((t.startsWith('{') || t.startsWith('[')) && /\.json$/i.test(f.name) || /^\{\s*"(engram|app|cards|deck|state)"/.test(t)) { s.busy = null; await importEngramJson(JSON.parse(t)); closePage(pg); return; }
      s.text = AnkiIO.parseText(text); setupTextMapping(s);
    }
  } catch (e) { console.error(e); s.busy = null; pg.refresh(); openDialog({ icon: 'error', title: 'Could not read this file', body: esc(e.message || String(e)), actions: [{ label: 'OK', value: true }] }); return; }
  s.busy = null; pg.refresh();
}

function ensureEngramTypes() {
  let b = Col.modelByName('Engram Basic'), c = Col.modelByName('Engram Cloze');
  const why = '{{#Why}}<div class="why"><b>Why</b><br>{{Why}}</div>{{/Why}}';
  const css = STOCK_CSS + '.why{margin-top:18px;padding:12px 14px;border-radius:14px;background:#f1ecfa;text-align:left;font-size:17px}\n.nightMode .why{background:#3a3150}\n.cloze{font-weight:bold;color:#6750a4}\n.nightMode .cloze{color:#d0bcff}\n';
  if (!b) { b = makeNotetype(0, 'Engram Basic', 'basic'); b.flds.push(newField('Why', 2), newField('Source', 3)); b.tmpls[0].afmt += '\n' + why; b.css = css; Col.addModel(b); }
  if (!c) { c = makeNotetype(0, 'Engram Cloze', 'cloze'); c.flds[1].name = 'Why'; c.flds.push(newField('Source', 2)); c.tmpls[0].afmt = '{{cloze:Text}}\n' + why; c.css = css; Col.addModel(c); }
  return { b, c };
}
function mdToHtml(t) {
  let s = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<i>$2</i>').replace(/==(.+?)==/g, '<mark>$1</mark>');
  const lines = s.split(/\r?\n/); let out = '', inList = false;
  for (const ln of lines) { const m = ln.match(/^\s*(?:[-•]|\d+[.)])\s+(.*)$/); if (m) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + m[1] + '</li>'; } else { if (inList) { out += '</ul>'; inList = false; } out += (out && !out.endsWith('</ul>') ? '<br>' : '') + ln; } }
  return inList ? out + '</ul>' : out;
}
async function importEngramJson(o) {
  if (o && o.state && o.state.cards) { const n = migrateOldState(o.state); App.refreshAll(); snack(`Imported ${plural(n, 'note')} from the Engram backup`); return; }
  const list = Array.isArray(o) ? o : (o.cards || []);
  const deck = Col.ensureDeck((o.deck && o.deck.name) || o.name || 'Imported');

    const cloze = (it.type || '').toLowerCase() === 'cloze' || /\{\{c\d+::/.test(it.text || '');
    const note = Col.newNote(cloze ? c.id : b.id);
    note.flds = cloze ? [mdToHtml(it.text || it.front || ''), mdToHtml(it.why || it.explanation || ''), esc(it.ref || it.source || '')] : [mdToHtml(it.front || it.question || ''), mdToHtml(it.back || it.answer || ''), mdToHtml(it.why || it.explanation || ''), esc(it.ref || it.source || '')];
    note.tags = [...new Set(tags)];

/* the Engram 1 library (kept in IndexedDB "engram") becomes notes with their progress */
function migrateOldState(S) {
  const { b, c } = ensureEngramTypes(); const byNote = new Map();
  for (const x of Object.values(S.cards || {})) { const k = x.note || x.id; if (!byNote.has(k)) byNote.set(k, []); byNote.get(k).push(x); }
  const t = Col.timing(), today = t.today, dayStart = t.nextDayAt - DAY; let n = 0;
  for (const cards of byNote.values()) {
    const x0 = cards[0], cloze = x0.type === 'cloze';
    const deckName = (S.decks && S.decks[x0.deck] && S.decks[x0.deck].name) || 'Engram';
    const deck = Col.ensureDeck(deckName);
    const note = Col.newNote(cloze ? c.id : b.id);
    note.flds = cloze ? [mdToHtml(x0.text || ''), mdToHtml(x0.why || ''), esc(x0.ref || '')] : [mdToHtml(x0.front || ''), mdToHtml(x0.back || ''), mdToHtml(x0.why || ''), esc(x0.ref || '')];
    note.tags = [...new Set([...(x0.tags || []), ...(x0.systems || []).map(s => 'system::' + s), ...(x0.disciplines || []).map(s => 'discipline::' + s)].map(s => String(s).replace(/\s+/g, '_')))];
    try { Col.addNote(note, deck.id); } catch (e) { continue; }
    n++;
    const made = Col.noteCards(note.id);
    for (const x of cards) {
      const card = cloze ? made.find(k => k.ord === (x.ord || 1) - 1) : made[0]; if (!card || !x.st) continue;
      card.type = x.st; card.reps = x.reps || 0; card.lapses = x.lapses || 0; card.factor = 2500;
      if (x.st === 2) { card.queue = 2; card.ivl = Math.max(1, x.ivl || 1); card.due = today + Math.round((x.due - dayStart) / DAY); }
      else { card.queue = 1; card.due = Math.floor(x.due / 1000); card.left = 1; card.ivl = x.ivl || 0; }
      if (x.susp) card.queue = -1;
      card.flags = x.flag || 0;
      if (x.s) card.data = JSON.stringify({ s: +(+x.s).toFixed(4), d: +(+x.d).toFixed(3), dr: 0.9, lrt: x.last ? Math.floor(x.last / 1000) : undefined });
      for (const [ts, g, ps, ivl] of x.log || []) Col.addRevlog({ id: ts, cid: card.id, usn: -1, ease: g, ivl: ivl || -600, lastIvl: 0, factor: 2500, time: 8000, type: ps === 2 ? 1 : ps === 3 ? 2 : 0 });
      Col.touchCard(card);
    }
  }
  if (n) { Col.conf.fsrs = true; }
  Col.reindexRevlog(); Col.markAll();
  return n;
}

/* =====================================================================
   INSIGHTS — Engram's own statistics, layered on top of Anki's data.
   Nothing here writes to the collection. Everything is derived from the
   revlog (the same rows Anki writes, synced and imported like any other),
   plus one device-only extra: the wall-clock study sessions recorded by
   the session clock, kept under the IndexedDB key "sessions".
   Exported .apkg / .colpkg files are unchanged by this layer.
   ===================================================================== */
const IX = { GAP: 30 * MIN, IDLE: 3 * MIN, KEEP: 4000 };

/* ---------------- recorded sessions (this device only) ---------------- */
const SessionLog = {
  list: [],
  async load() { try { const v = await Store.kvGet('sessions'); if (Array.isArray(v)) this.list = v.filter(s => s && s.n > 0).sort((a, b) => a.start - b.start); } catch (e) { } },
  put(s) {
    if (!s || !s.n) return;
    const rec = { id: s.id, start: s.start, end: s.end, active: Math.round(s.active), did: s.did, n: s.n, g: [...s.g], newN: s.newN, t: s.t };
    const i = this.list.findIndex(x => x.id === s.id);
    if (i >= 0) this.list[i] = rec; else this.list.push(rec);
    if (this.list.length > IX.KEEP) this.list.splice(0, this.list.length - IX.KEEP);
    Insights.bust(); this.save();
  },
  drop(id) { const i = this.list.findIndex(x => x.id === id); if (i >= 0) { this.list.splice(i, 1); Insights.bust(); this.save(); } },
  save: debounce(() => Store.kvSet('sessions', SessionLog.list).catch(() => { }), 800),
};

/* ---------------- formatting ---------------- */
function fmtDur(ms) {
  const m = Math.round(ms / MIN);
  if (ms < MIN) return ms <= 0 ? '0 min' : Math.max(1, Math.round(ms / 1000)) + ' s';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} h ${r} min` : `${h} h`;
}
/* big-number version: digits and units set apart so the units can be smaller */
function durHtml(ms) {
  const m = Math.round(ms / MIN);
  if (ms < MIN) return `<b>${Math.round(ms / 1000)}</b><i>s</i>`;
  if (m < 60) return `<b data-cu="${m}">${m}</b><i>min</i>`;
  const h = Math.floor(m / 60), r = m % 60;
  return `<b data-cu="${h}">${h}</b><i>h</i>${r ? ` <b data-cu="${r}">${r}</b><i>min</i>` : ''}`;
}
const minsText = t => t > 0 && t < MIN ? '<1' : String(Math.round(t / MIN));
const fmtClock = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`; };
const paceOf = (t, n) => n ? t / n / 1000 : 0;
const fmtPace = (t, n) => n ? paceOf(t, n).toFixed(1) + ' s' : '—';
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
const hourName = h => new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' });
const shortDate = (ms, opt) => new Date(ms).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' });
const clockTime = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function relDay(d) { return d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? new Date(Insights.dayMs(d) + 12 * HOUR).toLocaleDateString(undefined, { weekday: 'long' }) : shortDate(Insights.dayMs(d) + 12 * HOUR); }
const FIRST_DOW = (() => { try { const l = new Intl.Locale(navigator.language || 'en'); const w = (l.getWeekInfo && l.getWeekInfo()) || l.weekInfo; if (w && w.firstDay) return w.firstDay % 7; } catch (e) { } return 1; })();

/* ---------------- daily goal (a device preference) ---------------- */
const goalFrac = v => !v ? 0 : Prefs.goalType === 'cards' ? v.n / Math.max(1, Prefs.goalValue) : v.t / MIN / Math.max(1, Prefs.goalValue);
const goalText = () => Prefs.goalType === 'cards' ? `${plural(Prefs.goalValue, 'card')} a day` : `${Prefs.goalValue} min a day`;
function goalLeftText(v) {
  if (Prefs.goalType === 'cards') { const k = Math.max(0, Prefs.goalValue - (v ? v.n : 0)); return plural(k, 'card'); }
  const k = Math.max(1, Math.ceil(Prefs.goalValue - (v ? v.t : 0) / MIN)); return k + ' min';
}
function goalProgressText(v) {
  return Prefs.goalType === 'cards' ? `${fmtNum(v ? v.n : 0)} of ${fmtNum(Prefs.goalValue)} cards` : `${minsText(v ? v.t : 0)} of ${Prefs.goalValue} min`;
}

/* ---------------- computation ---------------- */
const Insights = {
  cache: new Map(),
  bust() { this.cache.clear(); },
  dayStart() { return Col.timing().nextDayAt - DAY; },
  dayMs(d) { return this.dayStart() - d * DAY; },
  dOf(ms, S) { return ms >= S ? 0 : Math.ceil((S - ms) / DAY); },
  scopeKey(scope) { return scope === 'deck' && Col.decks[Col.conf.curDeck] ? 'd' + Col.conf.curDeck : 'all'; },
  key(scope) { const rl = Col.revlog; return [rl.length, rl.length ? rl[rl.length - 1].id : 0, Col.today(), this.scopeKey(scope), Col.cards.size, Object.keys(Col.decks).length].join('|'); },
  scopeSet(scope) {
    if (this.scopeKey(scope) === 'all') return null;
    const ids = new Set(Col.deckAndChildIds(Col.conf.curDeck)), s = new Set();
    for (const c of Col.cards.values()) if (ids.has(c.did) || ids.has(c.odid)) s.add(c.id);
    return s;
  },
  /* card id → id of its top-level home deck (0 for deleted cards) */
  topMap() {
    const byName = new Map(), top = new Map();
    for (const d of Object.values(Col.decks)) byName.set(d.name.toLowerCase(), d);
    for (const d of Object.values(Col.decks)) { const t = byName.get(d.name.split('::')[0].toLowerCase()); top.set(+d.id, t ? +t.id : +d.id); }
    return cid => { const c = Col.cards.get(cid); if (!c) return 0; return top.get(+(c.odid || c.did)) || 0; };
  },
  lower(ms) { const a = Col.revlog; let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m].id < ms) lo = m + 1; else hi = m; } return lo; },
  ok: r => r.ease >= 1 && r.type <= 3,

  /* whole history, one pass: per-day totals, clusters of reviews (sessions) */
  all(scope = 'all') {
    const key = 'A' + this.key(scope); let v = this.cache.get(key); if (v) return v;
    const S = this.dayStart(), set = this.scopeSet(scope), days = new Map(), rl = Col.revlog, sess = [];
    let first = null, n = 0, t = 0, cl = null;
    for (let i = 0; i < rl.length; i++) {
      const r = rl[i]; if (r.ease < 1 || r.type > 3 || (set && !set.has(r.cid))) continue;
      const d = r.id >= S ? 0 : Math.ceil((S - r.id) / DAY);
      let x = days.get(d); if (!x) days.set(d, x = { n: 0, t: 0, again: 0, rn: 0, rok: 0 });
      x.n++; x.t += r.time; if (r.ease === 1) x.again++; if (r.type === 1) { x.rn++; if (r.ease > 1) x.rok++; }
      n++; t += r.time; if (first === null) first = r.id;
      if (!cl || r.id - cl.end > IX.GAP) { cl = { start: r.id - r.time, end: r.id, n: 0, t: 0, i0: i, i1: i }; sess.push(cl); }
      cl.end = r.id; cl.n++; cl.t += r.time; cl.i1 = i;
    }
    /* streaks: today counts once studied; before that, a streak that reached yesterday is still alive */
    let cur = 0, from = days.get(0) ? 0 : 1; while (days.get(from + cur)) cur++;
    const ds = [...days.keys()].sort((a, b) => a - b); let best = 0, run = 0, prev = null;
    for (const d of ds) { run = prev !== null && d === prev + 1 ? run + 1 : 1; prev = d; if (run > best) best = run; }
    let bestN = null, bestT = null; for (const [d, x] of days) { if (!bestN || x.n > bestN.x.n) bestN = { d, x }; if (!bestT || x.t > bestT.x.t) bestT = { d, x }; }
    v = { key, S, days, first, n, t, sess, streak: cur, streakAtRisk: cur > 0 && !days.get(0), bestStreak: best, bestN, bestT, activeDays: days.size, set };
    this.cache.set(key, v); return v;
  },

  /* sessions: review clusters from the revlog, with the device's own clock where it has one */
  sessions(A, fromMs) {
    const loc = SessionLog.list, out = [];
    let j = 0;
    for (const c of A.sess) {
      if (c.end < fromMs) continue;
      while (j < loc.length && loc[j].end < c.start - MIN) j++;
      let active = 0, did = 0, k = j, hit = false;
      while (k < loc.length && loc[k].start <= c.end + MIN) { if (loc[k].end >= c.start - MIN) { active += loc[k].active; did = did || loc[k].did; hit = true; } k++; }
      out.push({ start: c.start, end: c.end, n: c.n, t: c.t, i0: c.i0, i1: c.i1, clock: hit ? active : 0, did, dur: hit && active > 0 ? active : c.t });
    }
    return out;
  },
  sessionDeck(s, top) {
    if (s.did && Col.decks[s.did]) return Col.decks[s.did];
    const cnt = new Map(); for (let i = s.i0; i <= s.i1; i++) { const r = Col.revlog[i]; if (!this.ok(r)) continue; const d = top(r.cid); cnt.set(d, (cnt.get(d) || 0) + 1); }
    let bd = 0, bv = -1; for (const [d, v] of cnt) if (v > bv) { bv = v; bd = d; }
    return Col.decks[bd] || null;
  },

  /* one period (R days ending today) and the period before it, for comparison */
  range(R, scope = 'all') {
    const A = this.all(scope);
    if (R === 'all') R = Math.max(7, A.first ? this.dOf(A.first, A.S) + 1 : 7);
    const key = 'R' + A.key + '|' + R; let v = this.cache.get(key); if (v) return v;
    const S = A.S, cut = S - (R - 1) * DAY, pcut = cut - R * DAY, set = A.set, rl = Col.revlog, top = this.topMap();
    const days = Array.from({ length: R }, () => ({ n: 0, t: 0, again: 0, rn: 0, rok: 0 }));
    const kn = [0, 0, 0, 0], kt = [0, 0, 0, 0], gn = [0, 0, 0, 0], gt = [0, 0, 0, 0];
    const hours = Array.from({ length: 24 }, () => ({ n: 0, t: 0, rn: 0, rok: 0 }));
    const decks = new Map(), cards = new Map(), prev = { n: 0, t: 0, again: 0, rn: 0, rok: 0, active: new Set() };
    let n = 0, t = 0, again = 0, rn = 0, rok = 0, newN = 0, matured = 0;
    for (let i = this.lower(pcut); i < rl.length; i++) {
      const r = rl[i]; if (r.ease < 1 || r.type > 3 || (set && !set.has(r.cid))) continue;
      if (r.id < cut) { prev.n++; prev.t += r.time; if (r.ease === 1) prev.again++; if (r.type === 1) { prev.rn++; if (r.ease > 1) prev.rok++; } prev.active.add(Math.ceil((S - r.id) / DAY)); continue; }
      const d = r.id >= S ? 0 : Math.ceil((S - r.id) / DAY), x = days[R - 1 - d]; if (!x) continue;
      x.n++; x.t += r.time; if (r.ease === 1) x.again++;
      n++; t += r.time; if (r.ease === 1) again++;

/* ---------------- chart primitives (HTML bars, SVG lines) ---------------- */

/* smooth line (null = gap) with a soft area underneath */

/* ---------------- calendar ---------------- */
function ixCalendar(A, monthOff) {
  const S = A.S, sd = new Date(S + 12 * HOUR), todayMid = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate());
  const m0 = new Date(todayMid.getFullYear(), todayMid.getMonth() + monthOff, 1), days = new Date(m0.getFullYear(), m0.getMonth() + 1, 0).getDate();
  const lead = (m0.getDay() - FIRST_DOW + 7) % 7, cells = [];
  const heads = Array.from({ length: 7 }, (_, i) => new Date(2023, 0, 1 + ((FIRST_DOW + i) % 7)).toLocaleDateString(undefined, { weekday: 'narrow' }));
  let studied = 0, goals = 0;
  for (let i = 0; i < lead; i++) cells.push('<i class="d pad"></i>');
  for (let day = 1; day <= days; day++) {
    const date = new Date(m0.getFullYear(), m0.getMonth(), day), off = Math.round((todayMid - date) / DAY);
    const v = off >= 0 ? A.days.get(off) : null, f = goalFrac(v), fut = off < 0;
    if (v) studied++; if (f >= 1) goals++;
    const k = clamp(off, 0, 60);
    const tip = fut ? '' : v ? `${fmtNum(v.n)} cards, ${fmtDur(v.t)}` : 'No reviews';
    const shape = f >= 1 ? `<span class="gs">${shapeSvg((day % 5) + 2, 40)}</span>` : '';
    cells.push(`<button class="d ${fut ? 'fut' : ''} ${off === 0 ? 'today' : ''} ${v ? 'on' : ''} ${f >= 1 ? 'goal' : ''}" ${fut ? 'disabled' : `data-act="ix-day" data-d="${off}"`} style="--f:${Math.min(1, f).toFixed(3)};--k:${k}" aria-label="${date.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}: ${tip}">${shape}<span class="dn">${day}</span>${v && f < 1 ? `<span class="pf"></span>` : ''}</button>`);
  }
  const title = m0.toLocaleDateString(undefined, { month: 'long', year: m0.getFullYear() === todayMid.getFullYear() ? undefined : 'numeric' });
  const firstMonthOff = A.first ? (new Date(A.first).getFullYear() - todayMid.getFullYear()) * 12 + new Date(A.first).getMonth() - todayMid.getMonth() : 0;
  return `<div class="ix-cal">
    <div class="ix-cal-h"><button class="ib" data-act="ix-cal" data-m="-1" aria-label="Previous month" ${monthOff <= Math.min(0, firstMonthOff) ? 'disabled' : ''}>${ic('chevron_left')}</button>
      <div class="grow"><div class="tt-m">${esc(title)}</div><div class="bd-s muted">${studied ? `Studied on ${plural(studied, 'day')}${goals ? `, goal met on ${goals}` : ''}` : monthOff ? 'No reviews this month' : 'No reviews yet this month'}</div></div>
      <button class="ib" data-act="ix-cal" data-m="1" aria-label="Next month" ${monthOff >= 0 ? 'disabled' : ''}>${ic('chevron_right')}</button></div>
    <div class="ix-cal-g">${heads.map(h => `<span class="wh">${esc(h)}</span>`).join('')}${cells.join('')}</div>
  </div>`;
}

/* ---------------- the Insights view ---------------- */
const IX_RANGES = [[7, '7 days'], [30, '30 days'], [90, '3 months'], [365, '1 year'], ['all', 'All time']];

}
function ixHighlights(g, R0) {

    if (Math.abs(d) >= 0.3) out.push(d < 0 ? ['bolt', `You answer ${Math.abs(d).toFixed(1)} s faster per card than in ${prevWords(g.R)}.`] : ['hourglass_top', `Cards take ${d.toFixed(1)} s longer than in ${prevWords(g.R)}. Harder material usually does that.`]);
  }
  if (R0 !== 'all' && g.activeDays) out.push(['event_available', g.activeDays === g.R ? `You studied every single day of ${rangeWords(R0)}.` : `You studied on ${g.activeDays} of the last ${g.R} days.`]);
  let bh = -1, br = 0; g.hours.forEach((h, i) => { if (h.rn >= 20) { const r = h.rok / h.rn; if (r > br) { br = r; bh = i; } } });
  if (bh >= 0 && g.rn >= 60) out.push(['wb_sunny', `You remember best around ${hourName(bh)}: ${Math.round(br * 100)}% of reviews at that hour were correct.`]);
  if (g.gn[0] >= 10 && g.gn[2] >= 10) { const ra = (g.gt[0] / g.gn[0]) / (g.gt[2] / g.gn[2]); if (ra >= 1.3) out.push(['psychology_alt', `Cards you miss take ${ra.toFixed(1)}× as long as cards you get right. The Again button costs time twice.`]); }

/* ---------------- one day, in detail ---------------- */
function openIxDay(d) {
  const S = Insights.dayStart(), from = S - d * DAY, to = from + DAY, set = Insights.scopeSet(StatsUI.scope), top = Insights.topMap();
  const rl = Col.revlog; let n = 0, t = 0, again = 0, rn = 0, rok = 0, newN = 0; const decks = new Map(), cl = [];
  for (let i = Insights.lower(from); i < rl.length && rl[i].id < to; i++) {
    const r = rl[i]; if (!Insights.ok(r) || (set && !set.has(r.cid))) continue;
    n++; t += r.time; if (r.ease === 1) again++; if (r.type === 1) { rn++; if (r.ease > 1) rok++; }
    if (r.type === 0) { const h = Col.revByCid.get(r.cid); if (h && h[0] === r) newN++; }
    const td = top(r.cid); let x = decks.get(td); if (!x) decks.set(td, x = { n: 0, t: 0 }); x.n++; x.t += r.time;
    const last = cl[cl.length - 1]; if (!last || r.id - last.end > IX.GAP) cl.push({ start: r.id - r.time, end: r.id, n: 1, t: r.time }); else { last.end = r.id; last.n++; last.t += r.time; }
  }
  const loc = SessionLog.list.filter(s => s.end >= from && s.start < to);
  const title = new Date(from + 12 * HOUR).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const f = goalFrac({ n, t });
  const body = !n ? `<div class="empty">${ic('bedtime', 'lg')}<div class="bd-m muted">No reviews on this day.</div></div>` : `
    <div class="ix-daygoal ${f >= 1 ? 'met' : ''}"><span class="shp" style="--c:${f >= 1 ? 150 : 265}">${shapeSvg(f >= 1 ? 4 : 0)}${ic(f >= 1 ? 'flag' : 'outlined_flag', 'fill')}</span>
      <span class="bd-m">${f >= 1 ? 'Daily goal met' : `${Math.round(f * 100)}% of the daily goal`}<span class="muted"> · ${goalProgressText({ n, t })}</span></span></div>
    <div class="tiles" style="margin:12px 0 0">
      <div class="tile"><span class="num">${fmtNum(n)}</span><span class="cap">cards${newN ? `, ${newN} new` : ''}</span></div>
      <div class="tile t2"><span class="num">${fmtDur(t)}</span><span class="cap">time on cards</span></div>
      <div class="tile t3"><span class="num">${fmtPace(t, n)}</span><span class="cap">per card</span></div>
      <div class="tile t4"><span class="num">${rn ? pct(rok, rn) + '%' : pct(n - again, n) + '%'}</span><span class="cap">${rn ? 'reviews correct' : 'not pressed Again'}</span></div></div>
    <div class="sec-t" style="margin:20px 0 8px">Decks</div>
    <div class="infotable">${[...decks.entries()].sort((a, b) => b[1].t - a[1].t).map(([id, x]) => `<div><span>${esc(Col.decks[id] ? Col.decks[id].name : 'Deleted cards')}</span><span>${fmtDur(x.t)} · ${plural(x.n, 'card')}</span></div>`).join('')}</div>
    <div class="sec-t" style="margin:20px 0 8px">Sessions</div>
    <div class="infotable">${cl.map(s => { const lc = loc.filter(x => x.end >= s.start - MIN && x.start <= s.end + MIN), clock = lc.reduce((a, x) => a + x.active, 0); return `<div><span>${clockTime(s.start)} – ${clockTime(s.end)}</span><span>${plural(s.n, 'card')} · ${fmtDur(clock || s.t)}${clock ? ' on the clock' : ''}</span></div>`; }).join('')}</div>`;
  openSheet({ title, body });
}

/* ---------------- session clock (reviewer) ---------------- */
const Session = {
  begin(pg, did) {
    const now = Date.now();
    pg.sess = { id: now, start: now, end: now, active: 0, did: +did, n: 0, g: [0, 0, 0, 0], newN: 0, t: 0 };
    pg.sessLast = now; pg.lastInput = now; pg.paused = false; pg.sessHist = [];
    pg.sessTick = setInterval(() => Session.tick(pg), 1000);
    pg.onVis = () => { pg.sessLast = Date.now(); Session.paint(pg); };
    pg.poke = () => { const idle = Date.now() - pg.lastInput >= IX.IDLE; pg.lastInput = Date.now(); if (idle) { pg.sessLast = Date.now(); Session.paint(pg); } };
    document.addEventListener('visibilitychange', pg.onVis);
    pg.el.addEventListener('pointerdown', pg.poke, true);
  },
  running(pg) { return !!pg.sess && !pg.paused && !document.hidden && !pg.finished && Date.now() - pg.lastInput < IX.IDLE; },
  tick(pg) { const now = Date.now(), dt = Math.min(5000, Math.max(0, now - pg.sessLast)); pg.sessLast = now; if (this.running(pg)) pg.sess.active += dt; this.paint(pg); },
  paint(pg) {
    const b = pg.el.querySelector('[data-clock]'); if (!b || !pg.sess) return;
    const idle = !pg.paused && Date.now() - pg.lastInput >= IX.IDLE;
    b.classList.toggle('paused', !!pg.paused); b.classList.toggle('idle', idle);
    b.querySelector('.ms').textContent = pg.paused ? 'play_arrow' : idle ? 'bedtime' : 'timer';
    b.querySelector('span:last-child').textContent = fmtClock(pg.sess.active);
    b.setAttribute('aria-label', pg.paused ? `Paused at ${fmtClock(pg.sess.active)}. Resume` : `Session time ${fmtClock(pg.sess.active)}. Pause`);
    const pv = pg.el.querySelector('[data-pclock]'); if (pv) pv.textContent = fmtClock(pg.sess.active);
  },
  answered(pg, g, ms, wasNew) {
    const s = pg.sess; if (!s) return;
    s.n++; s.g[g - 1]++; s.t += ms; if (wasNew) s.newN++; s.end = Date.now();
    pg.sessHist.push([g, ms, wasNew]); pg.lastInput = Date.now(); SessionLog.put(s);
  },
  undone(pg) {
    const s = pg.sess, h = pg.sessHist && pg.sessHist.pop(); if (!s || !h) return;
    s.n = Math.max(0, s.n - 1); s.g[h[0] - 1] = Math.max(0, s.g[h[0] - 1] - 1); s.t = Math.max(0, s.t - h[1]); if (h[2]) s.newN = Math.max(0, s.newN - 1);
    if (s.n) SessionLog.put(s); else SessionLog.drop(s.id);
    if (!pg.sessTick) { pg.sessLast = Date.now(); pg.sessTick = setInterval(() => Session.tick(pg), 1000); }
  },
  pause(pg) {
    if (pg.paused || pg.finished || !pg.card) return;
    pg.paused = true; pg.pausedAt = Date.now(); clearTimeout(pg.autoTimer); buzz(8);
    try { pg.frame && pg.frame.contentWindow.EngramStop(); } catch (e) { }
    pg.el.classList.add('paused');
    const s = pg.sess, stage = pg.el.querySelector('[data-stage]');
    const ov = document.createElement('div'); ov.className = 'st-pause'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Session paused');
    ov.innerHTML = `<div class="st-pause-in">
      <span class="shp xl" style="--c:var(--h)">${shapeSvg(4)}${ic('pause', 'fill')}</span>
      <div class="bd-l muted">Paused</div>
      <div class="st-pclock" data-pclock>${fmtClock(s.active)}</div>
      <div class="bd-m muted">${s.n ? `${plural(s.n, 'card')} so far · ${fmtPace(s.t, s.n)} per card` : 'No cards answered yet'}</div>
      <div class="st-pause-acts"><button class="btn m" data-act="st-resume">${ic('play_arrow', 'fill')}Resume</button><button class="btn m tonal" data-act="back">End session</button></div></div>`;
    stage.appendChild(ov); this.paint(pg);
    setTimeout(() => ov.querySelector('[data-act="st-resume"]')?.focus(), 60);
  },
  resume(pg) {
    if (!pg.paused) return;
    const gap = Date.now() - pg.pausedAt; pg.paused = false; pg.shownAt += gap; pg.lastInput = Date.now(); pg.sessLast = Date.now(); buzz(6);
    pg.el.classList.remove('paused');
    const ov = pg.el.querySelector('.st-pause'); if (ov) { ov.classList.add('out'); setTimeout(() => ov.remove(), 220); }
    this.paint(pg);
  },
  toggle(pg) { if (pg.paused) this.resume(pg); else this.pause(pg); },
  end(pg) {
    if (!pg.sess) return;
    clearInterval(pg.sessTick); pg.sessTick = null;
    document.removeEventListener('visibilitychange', pg.onVis); pg.el.removeEventListener('pointerdown', pg.poke, true);
    if (pg.sess.n) { pg.sess.end = Math.max(pg.sess.end, pg.sess.start); SessionLog.put(pg.sess); SessionLog.save.now(); }
  },
};

/* theme and color changes cross-fade the whole screen; the control that was
   touched is lifted out of the fade so its own animation plays live */
function themeTransition(origin, change) {
  const run = () => { change(); applyTheme(); savePrefs(); };
  const after = () => { try { if (!topPage('study')) App.renderTab(App.tab); } catch (e) { } };
  if (!document.startViewTransition) { run(); after(); return; }
  if (origin) origin.style.viewTransitionName = 'theme-origin';
  const done = () => { if (origin) origin.style.viewTransitionName = ''; after(); };
  document.startViewTransition(run).finished.then(done, done);
}

function wireSettingsControls(el) {
  el.querySelectorAll('[data-seg="theme"] button').forEach(b => b.onclick = () => {
    if (Prefs.theme === b.dataset.v) return;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    buzz(6); themeTransition(b, () => { Prefs.theme = b.dataset.v; });
  });
  el.querySelectorAll('[data-hue]').forEach(b => b.onclick = () => {
    if (+Prefs.hue === +b.dataset.hue) return;
    el.querySelectorAll('[data-hue]').forEach(x => x.setAttribute('aria-pressed', x === b));
    buzz(6); themeTransition(b, () => { Prefs.hue = +b.dataset.hue; });
  });
  el.querySelectorAll('[data-range]').forEach(r => {
    const paint = () => r.style.setProperty('--p', ((r.value - r.min) / (r.max - r.min) * 100) + '%'); paint();
    r.oninput = () => {
      paint(); Prefs[r.dataset.range] = +r.value;
      const v = el.querySelector(`[data-rv="${r.dataset.range}"]`); if (v) v.textContent = Math.round(r.value * 100) + '%';
      if (r.dataset.range === 'textScale') applyTheme(); savePrefs();
    };
  });
  el.querySelectorAll('[data-pref]').forEach(b => b.onclick = e => { e.stopPropagation(); Prefs[b.dataset.pref] = !Prefs[b.dataset.pref]; b.setAttribute('aria-checked', Prefs[b.dataset.pref]); savePrefs(); buzz(4); });
  el.querySelectorAll('[data-conf]').forEach(b => b.onclick = e => { e.stopPropagation(); const c = Col.conf; c[b.dataset.conf] = !c[b.dataset.conf]; b.setAttribute('aria-checked', !!c[b.dataset.conf]); Col.touchMeta(); updateBadge(); buzz(4); });
  el.querySelectorAll('.swrow').forEach(r => r.onclick = e => { if (!e.target.closest('.sw')) r.querySelector('.sw').click(); });
  el.querySelectorAll('[data-confnum]').forEach(i => i.onchange = () => { const c = Col.conf; let v = Math.max(0, parseInt(i.value, 10) || 0); if (i.dataset.confnum === 'rollover') v = Math.min(23, v); i.value = v; if (i.dataset.scale) v *= +i.dataset.scale; c[i.dataset.confnum] = v; Col.touchMeta(); updateBadge(); });
}

function markMatch(text, q) {
  const low = text.toLowerCase(); let i = low.indexOf(q), n = q.length;

    if (c.odid && !Col.decks[c.odid]) { c.odid = 0; c.odue = 0; Col.touchCard(c); fixed++; }
    if (c.odid && Col.decks[c.did] && !Col.decks[c.did].dyn) { c.odid = 0; c.odue = 0; Col.touchCard(c); fixed++; }

    openMenu(b, items.map(n => ({ icon: 'data_object', label: n, run: () => { const ta = p.el.querySelector('#tp-code'); const ins = n === 'Type' ? `{{type:${d.flds[1] ? d.flds[1].name : d.flds[0].name}}}` : d.type === 1 && n === d.flds[0].name ? `{{cloze:${n}}}` : `{{${n}}}`; ta.focus(); document.execCommand('insertText', false, ins); } })));
  },
  'fd-save': (b) => pageOf(b).state.save(),
  /* options */
  'opt-save': (b) => pageOf(b).state.save(false),
  'opt-subdecks': (b) => pageOf(b).state.save(true),
  'opt-preset-menu': (b) => presetMenu(b, pageOf(b)),
  'opt-recompute': (b) => {
    const p = pageOf(b); p.state.read(); const confId = p.state.confId; let n = 0;
    for (const c of Col.cards.values()) { const d = Col.decks[c.odid || c.did]; if (!d || +d.conf !== confId || c.type === 0) continue; const x = Sched.parseData(c); if ('s' in x || 'd' in x) { delete x.s; delete x.d; Sched.writeData(c, x); Col.touchCard(c, true); n++; } }
    snack(`Memory states will be rebuilt from history for ${plural(n, 'card')}`);
  },
  /* import / export */
  'imp-pick': (b) => { const p = pageOf(b); pickFile(f => readImportFile(p, f)); },
  'imp-go': (b) => runPkgImport(pageOf(b)),
  'ti-go': (b) => runTextImport(pageOf(b)),
  'ex-go': (b) => runExport(pageOf(b).state),
  /* maintenance */
  'check-db': () => checkDatabase(),
  'check-media': () => checkMedia(),
  'empty-cards': () => emptyCards(),
  erase: () => eraseAll(),
  'ex-parts': () => exportParts(topPage('export').state),
  'export-media-zip': () => exportMediaZip(),
};
Object.assign(ACT, ACT_EXTRA);
Object.assign(ACT, IX_ACT);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault(); e.stopPropagation();
  try { const r = f(b, e); if (r && r.catch) r.catch(err => { console.error(err); snack('Something went wrong: ' + err.message); }); }
  catch (err) { console.error(err); snack('Something went wrong: ' + err.message); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.deckrow,.mo')) { e.preventDefault(); e.target.click(); } });
$$('.nav-i[data-nav]').forEach(b => b.addEventListener('click', () => { while (App.pages.length) { const p = App.pages[App.pages.length - 1]; Back.drop(p.closer); p.closer(); } App.switchTab(b.dataset.nav); }));
window.addEventListener('resize', debounce(() => { const s = topPage('study'); if (s && !s.finished) paintStudyTop(s); }, 150));
/* rotating between portrait and landscape: the tab behind a detail pane may become visible */
WIDE.addEventListener('change', () => { if (tabVisible()) App.renderTab(App.tab); App.syncChrome(); const s = topPage('study'); if (s && !s.finished) requestAnimationFrame(() => paintStudyTop(s)); });
/* Escape steps back on a keyboard, like the Android back gesture (not while typing in a page) */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented || !Back.stack.length) return;
  const t = e.target, typing = t && t.matches && t.matches('input,textarea,select,[contenteditable],[contenteditable] *');
  if (typing && !t.closest('#overlays')) return;
  if (Back.stack[Back.stack.length - 1] === App.tabCloser) return;
  e.preventDefault(); Back.pop();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); if (Prefs.theme === 'system') App.refreshAll(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Store.flush().then(() => Sync.enabled() && Sync.ob.size && Sync.run({ reason: 'background', keepalive: true })); } else { if (Sync.enabled()) Sync.run({ reason: 'auto', pullOnly: !Sync.ob.size }); Sched.unburyIfNewDay(); if (tabVisible()) App.renderTab(App.tab); updateBadge(); } });
window.addEventListener('pagehide', () => { Store.flush(); SessionLog.save.now(); });
window.addEventListener('online', () => { Sync.lastError = null; Sync.refreshState(); Sync.run({ reason: 'auto' }); });
window.addEventListener('offline', () => Sync.refreshState());
/* opening files dropped on the app */
document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f || e.defaultPrevented) return; e.preventDefault(); const p = topPage('import'); if (p) readImportFile(p, f); else openImport(f); });

/* =====================================================================
   BOOT
   ===================================================================== */
async function readOldEngram() {
  try {
    const db = await new Promise((res, rej) => { const r = indexedDB.open('engram', 1); r.onupgradeneeded = () => { r.transaction.abort(); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (!db.objectStoreNames.contains('kv')) return null;
    return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
  } catch (e) { return null; }
}
(async function boot() {
  installSprings();
  try { const p = await Store.kvGet('prefs'); if (p) Object.assign(Prefs, p); } catch (e) { }
  applyTheme();
  let loaded = false;
  try { loaded = await Store.load(); } catch (e) { console.warn('load failed', e); }
  try { await Sync.load(); } catch (e) { console.warn('sync state', e); Sync.st = Sync.st || Sync.defaults(); Sync.shadow = Sync.shadow || Sync.emptyShadow(); }
  if (!loaded) {
    Col.createEmpty(); Col.ensureBasics();
    const old = await readOldEngram();
    if (old && old.cards && Object.keys(old.cards).length) {
      const n = migrateOldState(old);
      setTimeout(() => snack(`Your Engram 1 library (${plural(n, 'note')}) was moved into the new Anki-style collection`), 800);
    }
    Col.markAll(); await Store.flush();
  }
  try { await SessionLog.load(); } catch (e) { }
  Browse.query = Prefs.lastSearch || 'deck:current';
  Sched.unburyIfNewDay();
  App.switchTab('decks', true);
  updateBadge();
  try { await MediaCache.load(); } catch (e) { console.warn('media cache', e); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if (Sync.enabled()) { Sync.run({ reason: 'auto' }); ensureMediaHashes().catch(() => { }); }
  else if (!Sync.st.seenSetup) openSetup();
  Sync.refreshState();
  setInterval(() => { if (!document.hidden && Sync.enabled() && navigator.onLine !== false) Sync.run({ reason: 'poll', pullOnly: !Sync.ob.size }); }, 60000);
  setInterval(() => { if (!document.hidden && !topPage('study') && !topPage('editor')) { if (Col.conf.lastUnburied !== Col.today()) { Sched.unburyIfNewDay(); if (tabVisible()) App.renderTab(App.tab); } updateBadge(); } }, 60000);
})();

</script>
